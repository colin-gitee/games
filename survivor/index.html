<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>怪潮求生 · 割草闯关</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--ink:#0e0c12;--stone:#1d1a24;--line:#4a4356;--text:#efe6d0;--dim:#a79db3;--brass:#e3b558;--accent:#ef7a5e;
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{margin:0;background:#000;color:var(--text);font:14px/1.5 'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(#35303f,#262230);border-radius:10px;padding:6px 12px;box-shadow:0 2px 0 #0008,inset 0 1px 0 #ffffff14}
button:not(:disabled):active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--text);text-decoration:none}
.pill{border:1px solid #fff3;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;background:#000a;box-shadow:none;display:inline-block}
.primary{background:linear-gradient(#ffb09a,var(--accent));border-color:#000a;color:#1c100c;font-weight:700}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;z-index:3;padding:calc(6px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) 0 calc(8px + env(safe-area-inset-left,0px));pointer-events:none}
.hud>*{pointer-events:auto}
#xp{height:10px;border-radius:5px;background:#000a;border:1px solid #000;overflow:hidden;pointer-events:none}
#xp i{display:block;height:100%;width:0;background:linear-gradient(#8fe0ff,#3a9ae0);transition:width .15s}
.row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;pointer-events:none;padding-right:128px}.row>*{pointer-events:auto}
.chip{background:#000a;border:1px solid #fff2;border-radius:999px;padding:2px 11px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.chip b{font-size:15px}.chip.gold b{color:var(--brass)}
#timeV{font-family:var(--display);font-size:20px;letter-spacing:.06em;text-shadow:0 2px 0 #000;pointer-events:none}
#gear{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;pointer-events:none;padding-right:128px}
#gear span{background:#000a;border:1px solid #fff2;border-radius:6px;padding:0 6px;font-size:11.5px;white-space:nowrap}
#gear span b{color:var(--brass)}#gear span.buff{border-color:var(--brass);color:#ffe9a0}
#mini{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:calc(22px + env(safe-area-inset-top,0px));z-index:3;width:116px;height:auto;border:2px solid #000;outline:1px solid #fff4;border-radius:8px;background:#000a;pointer-events:none}
.ov{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,.78);backdrop-filter:blur(3px);padding:12px}
.box{background:linear-gradient(#2c2836,#1a1722);border:2px solid var(--brass);border-radius:18px;padding:16px 18px 18px;text-align:center;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px #000}
.box h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:32px;letter-spacing:.1em;color:var(--brass);text-shadow:0 3px 0 #000}
.box h3{margin:14px 0 6px;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.1em;color:var(--brass);text-align:left;display:flex;justify-content:space-between;align-items:baseline}
.box h3 small{font-family:'Noto Sans SC',sans-serif;letter-spacing:0;font-size:13px;color:var(--text)}
.box p{margin:4px 0 10px;color:var(--dim)}.box p b{color:var(--text)}
.lvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lv{padding:0;overflow:hidden;border-radius:12px;text-align:left;position:relative}
.lv canvas{display:block;width:100%;height:auto}
.lv div{padding:5px 9px 7px}.lv b{display:block;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em}.lv small{color:var(--dim);font-size:11.5px}
.lv.done b::after{content:' ✓';color:#7be05c}
.lv:disabled canvas{filter:grayscale(1) brightness(.35)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.up{display:flex;align-items:center;gap:8px;text-align:left;background:#0004;border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 10px}
.up .t{flex:1;min-width:0}.up b{font-size:13.5px}.up b i{font-style:normal;color:var(--brass);font-size:11.5px;margin-left:5px}.up small{display:block;color:var(--dim);font-size:11.5px;line-height:1.3}
.up button{white-space:nowrap;padding:6px 9px;min-width:64px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border-radius:14px}
.opt canvas{width:44px;height:44px;flex:none;border-radius:10px;background:radial-gradient(circle at 50% 35%,#4a4458,#1c1924);border:1px solid #000a}
.opt b{display:block;font-size:15px}.opt b i{font-style:normal;color:var(--brass);font-size:12px;margin-left:6px}
.opt small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.btns>*{padding:8px 18px}
.how{color:var(--dim);font-size:12.5px;text-align:left;margin:4px 0 0;line-height:1.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="mini" width="232" height="160" hidden></canvas>
<div class="hud" id="hud" hidden>
  <div id="xp"><i id="xpBar"></i></div>
  <div class="row">
    <button class="pill" id="pauseBtn">暂停</button>
    <span class="chip">Lv <b id="lvV">1</b></span>
    <span id="timeV">0:00</span>
    <span class="chip gold">● <b id="goldV">0</b></span>
    <span class="chip">击杀 <b id="killV">0</b></span>
  </div>
  <div id="gear"></div>
</div>

<div class="ov" id="menu"><div class="box">
  <h2>怪潮求生</h2>
  <p class="how">角色<b>自动攻击</b>，你只管走位：手机按住屏幕拖动，电脑用 WASD。撑到倒计时结束会出现首领，打倒它就过关。地图上会刷出<b>道具</b>（旋刃、疾风、狂暴、护盾、磁铁、炸弹、药水），右上角小地图上的黄点就是。打怪掉的<b>金币</b>在下面买永久强化。</p>
  <h3>选择关卡</h3>
  <div class="lvs" id="lvs"></div>
  <h3>强化 <small>金币 <b id="bankV" style="color:var(--brass)">0</b></small></h3>
  <div class="shop" id="shop"></div>
  <div class="btns"><a class="pill" href="../index.html" style="padding:8px 18px">‹ 大厅</a></div>
</div></div>
<div class="ov" id="lvOv" hidden><div class="box" style="width:min(440px,100%)"><h2>升级！</h2><p>选一个强化</p><div id="opts"></div></div></div>
<div class="ov" id="pauseOv" hidden><div class="box" style="width:min(440px,100%)"><h2 id="pzTitle">已暂停</h2><p id="pzText"></p>
  <div class="btns"><button class="primary" id="resumeBtn">继续</button><button id="sndBtn">音效 开</button><button id="quitBtn">放弃本关</button></div></div></div>
<div class="ov" id="endOv" hidden><div class="box" style="width:min(440px,100%)"><h2 id="endTitle"></h2><p id="endText"></p>
  <div class="btns"><button class="primary" id="againBtn">回到关卡选择</button></div></div></div>

<script src="../shared/monsters.js"></script>
<script>
'use strict';
/* =====================================================================
   怪潮求生 — 幸存者类闯关。结构：数据(关卡/怪物/武器/道具/商店) → 地图生成 → 逻辑 step(dt) → 渲染 → 界面/输入/存档。
   加关卡：LEVELS 里加一项并在 genMap 里写它的障碍布局；加道具：ITEMS；加商店强化：SHOP。
   ===================================================================== */
const $=id=>document.getElementById(id);
const M=Monsters,OL=M.OL,COL=Object.fromEntries(M.LIST.map(m=>[m[0],m[2]])),NAME=Object.fromEntries(M.LIST.map(m=>[m[0],m[1]]));
// 怪物：r 半径、hp 生命、sp 速度、dmg 接触伤害、xp 经验
const ET={
  slime:{r:13,hp:10,sp:46,dmg:6,xp:1},bee:{r:8,hp:5,sp:92,dmg:4,xp:1},bat:{r:11,hp:14,sp:80,dmg:6,xp:2},wolf:{r:13,hp:26,sp:96,dmg:9,xp:3},
  skel:{r:13,hp:40,sp:55,dmg:10,xp:3},spider:{r:9,hp:16,sp:106,dmg:7,xp:2},scarab:{r:9,hp:22,sp:70,dmg:6,xp:2},mummy:{r:17,hp:110,sp:38,dmg:14,xp:8},
  scorpion:{r:13,hp:55,sp:85,dmg:12,xp:5},treant:{r:19,hp:200,sp:32,dmg:16,xp:12},garg:{r:18,hp:170,sp:58,dmg:15,xp:11},worm:{r:14,hp:70,sp:72,dmg:11,xp:6},
};
// 关卡：w/h 地图大小，T 撑多少秒出首领，pools 三个阶段的怪物池，rate 每秒出怪数(开始→结束)，hpK 怪物生命倍率
const LEVELS=[   // 每关都从 1 级开始，所以第一阶段只放弱怪，难度靠数量、后两阶段的怪和首领拉开
  {id:'forest',name:'林间空地',tip:'树木和池塘',w:2100,h:1500,T:150,pools:[['slime','bee'],['slime','bat','bee'],['bat','wolf','slime']],rate:[.7,2.2],hpK:1,boss:{id:'troll',r:30,hp:650,sp:44,dmg:20}},
  {id:'desert',name:'流沙遗迹',tip:'断墙围成的废墟',w:2500,h:1700,T:180,pools:[['scarab','bee'],['scarab','scorpion','worm'],['mummy','scorpion','worm']],rate:[.9,3],hpK:1.15,boss:{id:'pharaoh',r:30,hp:1500,sp:50,dmg:24}},
  {id:'cave',name:'幽暗矿洞',tip:'巨石之间的通道',w:2300,h:1900,T:200,pools:[['bat','spider'],['skel','spider','bat'],['garg','skel','spider']],rate:[1,3.3],hpK:1.3,boss:{id:'spider',name:'洞蛛女王',r:34,hp:2200,sp:66,dmg:26}},
  {id:'grave',name:'亡者墓园',tip:'成排的墓碑和栅栏',w:2600,h:1800,T:220,pools:[['bat','slime'],['skel','bat','wolf'],['mummy','skel','wolf']],rate:[1.1,3.6],hpK:1.45,boss:{id:'skel',name:'骷髅王',r:34,hp:3000,sp:58,dmg:30}},
  {id:'lava',name:'熔岩王座',tip:'石柱与岩浆池',w:2400,h:2000,T:240,pools:[['spider','scarab'],['scorpion','skel','spider'],['garg','treant','scorpion']],rate:[1.2,4],hpK:1.6,boss:{id:'lava',r:38,hp:4200,sp:54,dmg:34}},
];
const MAXW=6,MAXP=5;
const WEAPONS={
  dagger:{name:'飞刀',col:'#dfe4ee',desc:l=>['朝最近的敌人掷出飞刀','飞刀 +1','伤害 +40%','飞刀 +1，可穿透 1 个','冷却 -25%','飞刀 +2，穿透 +1'][l-1]},
  blade:{name:'旋刃',col:'#8fdcff',desc:l=>['一把刀刃绕身旋转','刀刃 +1','伤害 +40%','刀刃 +1，范围更大','转速 +40%','刀刃 +2'][l-1]},
  bolt:{name:'落雷',col:'#b48cff',desc:l=>['定时劈中一个随机敌人','落雷 +1','伤害 +50%','落雷 +1','冷却 -25%','落雷 +2，范围更大'][l-1]},
  fire:{name:'火球',col:'#ff8a2a',desc:l=>['掷出火球，命中后范围爆炸','爆炸范围 +25%','伤害 +50%','火球 +1','冷却 -25%','范围 +25%，伤害 +50%'][l-1]},
  frost:{name:'冰环',col:'#9fe0ff',desc:l=>['定时放出冰环，伤害并减速周围敌人','范围 +20%','伤害 +60%','冷却 -25%','减速更强、更久','范围 +30%，伤害 +60%'][l-1]},
  aura:{name:'圣光',col:'#ffe9a0',desc:l=>['身边的敌人持续受到伤害','范围 +20%','伤害 +50%','范围 +20%','伤害 +50%','范围 +25%，伤害 +50%'][l-1]},
};
const PASSIVES={
  might:{name:'力量',col:'#ef5a4e',desc:'全部伤害 +12%'},haste:{name:'疾行',col:'#7be05c',desc:'移动速度 +8%'},body:{name:'体魄',col:'#ff8a7e',desc:'最大生命 +20，并回复 20'},
  magnet:{name:'磁石',col:'#e3b558',desc:'拾取范围 +35%'},calm:{name:'冷静',col:'#7cc8f0',desc:'全部冷却 -7%'},regen:{name:'再生',col:'#ffb0c8',desc:'每秒回复 +0.5 生命'},
};
// 地图道具：t 持续秒数（没有就是立即生效）
const ITEMS={
  blade:{name:'旋刃风暴',col:'#8fdcff',t:15,tip:'多 3 把旋刃'},speed:{name:'疾风',col:'#7be05c',t:12,tip:'移速 +50%'},rage:{name:'狂暴',col:'#ef5a4e',t:12,tip:'冷却 -40%'},
  shield:{name:'护盾',col:'#ffe9a0',t:6,tip:'无敌'},magnet:{name:'磁铁',col:'#e3b558',tip:'吸来全部经验'},bomb:{name:'炸弹',col:'#ff8a2a',tip:'炸伤屏幕内全部敌人'},
  potion:{name:'药水',col:'#ff8a7e',tip:'回复 40 生命'},chest:{name:'宝箱',col:'#ffd76a',tip:'一袋金币'},
};
const ITEM_POOL=['blade','speed','rage','shield','magnet','bomb','potion','potion','chest'];
// 商店（永久强化）：base 起价，每级 ×1.5
const SHOP={
  hp:{name:'体质',max:10,base:40,desc:l=>`最大生命 +${12*l}`},atk:{name:'锋利',max:10,base:50,desc:l=>`全部伤害 +${6*l}%`},spd:{name:'轻盈',max:6,base:45,desc:l=>`移动速度 +${4*l}%`},
  blade:{name:'随身旋刃',max:3,base:120,desc:l=>l?`开局自带 ${l} 级旋刃`:'开局自带旋刃'},armor:{name:'护甲',max:5,base:70,desc:l=>`每次受伤 -${l}`},pick:{name:'引力',max:5,base:35,desc:l=>`拾取范围 +${20*l}%`},
  greed:{name:'贪婪',max:5,base:60,desc:l=>`金币 +${15*l}%`},revive:{name:'复活',max:1,base:260,desc:l=>'每关可以原地复活一次'},
};

/* ---------- 音效 ---------- */
const AU={ctx:null,on:true,last:{}};try{AU.on=localStorage.getItem('arcade-sv-sound')!=='0'}catch(e){}
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}if(!AU.on)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{AU.ctx=new C();AU.out=AU.ctx.createGain();AU.out.gain.value=.35;AU.out.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
function tone(n,type,f0,f1,dur,vol,gap){if(!AU.on||!AU.ctx)return;const c=AU.ctx,t=c.currentTime;if(t-(AU.last[n]||0)<(gap||.06))return;AU.last[n]=t;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.02)}

/* ---------- 永久进度 ---------- */
let meta={gold:0,up:{},cleared:[]};try{const d=JSON.parse(localStorage.getItem('arcade-sv-meta')||'null');if(d&&typeof d.gold==='number')meta=Object.assign(meta,d)}catch(e){}
const saveMeta=()=>{try{localStorage.setItem('arcade-sv-meta',JSON.stringify(meta))}catch(e){}};
const ul=k=>meta.up[k]||0,upCost=k=>ul(k)>=SHOP[k].max?null:Math.round(SHOP[k].base*Math.pow(1.5,ul(k)));
function buy(k){const c=upCost(k);if(c==null||meta.gold<c)return false;meta.gold-=c;meta.up[k]=ul(k)+1;saveMeta();return true}
const unlocked=i=>i===0||!!meta.cleared[i-1];

/* ---------- 地图 ---------- */
const GC=160;let MAP=null;const mapCache={};
function genMap(L){
  if(mapCache[L.id])return mapCache[L.id];
  let s=0;for(const ch of L.id)s=s*31+ch.charCodeAt(0)|0;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},rr=(a,b)=>a+R()*(b-a);
  const W=L.w,H=L.h,cx=W/2,cy=H/2,obs=[],far=(x,y,d)=>Math.hypot(x-cx,y-cy)>d;
  const C=(x,y,r,kind)=>{if(far(x,y,r+150)&&x>r+20&&x<W-r-20&&y>r+20&&y<H-r-20)obs.push({t:'c',x,y,r,kind})};
  const B=(x,y,w,h,kind)=>{if(far(x+w/2,y+h/2,Math.max(w,h)/2+150)&&x>20&&y>20&&x+w<W-20&&y+h<H-20)obs.push({t:'r',x,y,w,h,kind})};
  if(L.id==='forest'){for(let i=0;i<3;i++)C(rr(250,W-250),rr(250,H-250),rr(80,120),'pond');
    for(let i=0;i<16;i++){const gx=rr(120,W-120),gy=rr(120,H-120);for(let k=0;k<4+R()*4;k++)C(gx+rr(-110,110),gy+rr(-90,90),rr(20,28),'tree')}
    for(let i=0;i<16;i++)C(rr(80,W-80),rr(80,H-80),rr(18,30),'rock')}
  else if(L.id==='desert'){const ru=[];for(let i=0;i<40&&ru.length<8;i++){const x=rr(120,W-420),y=rr(120,H-380),w=rr(180,300),h=rr(150,240),th=26,g=rr(.25,.6);if(ru.some(q=>x<q[0]+q[2]+90&&x+w+90>q[0]&&y<q[1]+q[3]+90&&y+h+90>q[1]))continue;ru.push([x,y,w,h]);   // 一圈有缺口的断墙，废墟之间留出通道
      B(x,y,w*g,th,'wall');B(x+w*(g+.25),y,w*(.75-g),th,'wall');B(x,y+h,w*.4,th,'wall');B(x+w*.65,y+h,w*.35,th,'wall');B(x,y+th,th,h*.45,'wall');B(x+w-th,y+h*.5,th,h*.5,'wall')}
    for(let i=0;i<26;i++)C(rr(80,W-80),rr(80,H-80),rr(18,32),'rock');for(let i=0;i<18;i++)C(rr(80,W-80),rr(80,H-80),15,'cactus')}
  else if(L.id==='cave'){const cs=290;for(let gy=0;gy*cs<H;gy++)for(let gx=0;gx*cs<W;gx++){if(R()<.6){const x=gx*cs+rr(60,120),y=gy*cs+rr(60,120);if(R()<.5)B(x,y,rr(110,170),rr(100,160),'bigrock');else C(x+60,y+60,rr(60,88),'boulder')}}
    for(let i=0;i<34;i++)C(rr(80,W-80),rr(80,H-80),rr(12,18),'crystal')}
  else if(L.id==='grave'){for(let gy=0;gy<10;gy++)for(let gx=0;gx<17;gx++){if(R()<.62)B(120+gx*145+rr(-10,10),150+gy*165+rr(-10,10),34,26,'tomb')}
    for(let i=0;i<14;i++){const x=rr(100,W-400),y=rr(100,H-100),w=rr(180,320);if(R()<.5)B(x,y,w,14,'fence');else B(x,y,14,Math.min(w,H-y-60),'fence')}
    for(let i=0;i<22;i++)C(rr(80,W-80),rr(80,H-80),rr(18,24),'deadtree')}

// 把半径 rad 的圆推出障碍和地图边界；返回是否碰到了东西
function pushOut(e,rad){

    if(o.t==='c'){const dx=e.x-o.x,dy=e.y-o.y,q=o.r+rad,d2=dx*dx+dy*dy;if(d2<q*q){const d=Math.sqrt(d2)||.01;e.x=o.x+dx/d*q;e.y=o.y+dy/d*q;hit=true}}
    else{const nx=Math.max(o.x,Math.min(e.x,o.x+o.w)),ny=Math.max(o.y,Math.min(e.y,o.y+o.h)),dx=e.x-nx,dy=e.y-ny,d2=dx*dx+dy*dy;

        else{const a=e.x-o.x,b=o.x+o.w-e.x,c=e.y-o.y,dd=o.y+o.h-e.y,m=Math.min(a,b,c,dd);if(m===a)e.x=o.x-rad;else if(m===b)e.x=o.x+o.w+rad;else if(m===c)e.y=o.y-rad;else e.y=o.y+o.h+rad}}}}
  if(e.x<rad){e.x=rad;hit=true}else if(e.x>MAP.W-rad){e.x=MAP.W-rad;hit=true}if(e.y<rad){e.y=rad;hit=true}else if(e.y>MAP.H-rad){e.y=MAP.H-rad;hit=true}

let mv={x:0,y:0};
function step(dt){

  }

function choices(){

const fmt=t=>(t/60|0)+':'+String(t%60|0).padStart(2,'0');

  $('gear').innerHTML=Object.entries(S.w).map(([k,v])=>`<span>${WEAPONS[k].name} <b>${v.lv}</b></span>`).join('')+Object.entries(S.pv).map(([k,v])=>`<span style="opacity:.8">${PASSIVES[k].name} <b>${v}</b></span>`).join('')+'<span id="buffs" style="display:contents"></span>';

    $('endText').innerHTML=`${MAP.L.name} · 坚持 <b>${fmt(S.t)}</b> · Lv${S.lv} · 击杀 ${S.kills}<br>带回金币 <b style="color:var(--brass)">${S.gold}</b>`+(win?`（含过关奖励 ${S.bonus}${S.first?'，首次通关翻倍':''}）`:'')+(win&&LEVELS[S.li+1]&&S.first?`<br>解锁了「${LEVELS[S.li+1].name}」`:win?'':'<br>去买点强化再来')}

function showMenu(){
