<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>方块拓荒 · 沙盒</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--ink:#0e0c12;--stone:#1d1a24;--line:#4a4356;--text:#efe6d0;--dim:#a79db3;--brass:#e3b558;--accent:#8fd06a;
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:#000;color:var(--text);font:14px/1.5 'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(#35303f,#262230);border-radius:10px;padding:6px 12px;box-shadow:0 2px 0 #0008,inset 0 1px 0 #ffffff14}
button:not(:disabled):active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45}
a{color:var(--text);text-decoration:none}
.pill{border:1px solid #fff3;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;background:#000a;box-shadow:none;display:inline-block}
.primary{background:linear-gradient(#b8e89a,var(--accent));border-color:#000a;color:#10160c;font-weight:700}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
.hud{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) 0 calc(8px + env(safe-area-inset-left,0px))}
.hud>*{pointer-events:auto}
.chip{background:#000a;border:1px solid #fff2;border-radius:999px;padding:2px 11px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
#hpBar{width:110px;height:14px;border-radius:7px;background:#000a;border:1px solid #000;overflow:hidden;pointer-events:none}
#hpBar i{display:block;height:100%;background:linear-gradient(#ff8a7e,#c9342a);transition:width .2s}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:5px;max-width:min(560px,calc(100vw - 16px));overflow-x:auto;padding:4px;background:#000a;border:1px solid #fff2;border-radius:14px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.slot{position:relative;width:46px;height:46px;flex:none;border-radius:10px;border:2px solid #fff2;background:#1c1924;padding:0;box-shadow:none}
.slot canvas{width:32px;height:32px;display:block;margin:5px auto 0;image-rendering:pixelated}
.slot b{position:absolute;right:3px;bottom:0;font-size:11px;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 0 14px #e3b55888;background:#2c2836}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;z-index:3;background:#ffffff14;border:2px solid #ffffff40;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#ffffff66;pointer-events:none}
#jump{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;z-index:3;background:#ffffff1c;border:2px solid #ffffff55;font-size:17px;touch-action:none;box-shadow:none}
#jump.dn{background:#ffffff55}
@media (hover:hover) and (pointer:fine){#joy,#jump{display:none}}
.ov{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,.74);backdrop-filter:blur(3px);padding:14px}
.box{background:linear-gradient(#2c2836,#1a1722);border:2px solid var(--brass);border-radius:18px;padding:16px 18px 18px;width:min(460px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px #000}
.box h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.1em;color:var(--brass);text-shadow:0 3px 0 #000;display:flex;justify-content:space-between;align-items:center}
.box h2 button{font-family:inherit;font-size:14px;letter-spacing:0}
.box p{margin:4px 0 10px;color:var(--dim)}
.rec{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #ffffff12}
.rec canvas{width:36px;height:36px;flex:none;image-rendering:pixelated;border-radius:8px;background:#1c1924;border:1px solid #000}
.rec .t{flex:1;min-width:0}.rec b{display:block}.rec small{color:var(--dim);font-size:12px;display:block}
.rec small .no{color:#ff8a7e}
.rec.off{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns>*{padding:8px 16px}
.how{color:var(--dim);font-size:12.5px;line-height:1.65;margin:6px 0 10px}.how b{color:var(--text)}
#toast{position:fixed;left:50%;top:calc(46px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;background:#000c;border:1px solid var(--brass);border-radius:999px;padding:3px 14px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div id="hpBar"><i id="hpI"></i></div>
  <span class="chip" id="infoV"></span>
  <span style="flex:1"></span>
  <button class="pill" id="craftBtn">合成</button>
  <button class="pill" id="menuBtn">菜单</button>
</div>
<div id="joy"><i id="joyI"></i></div>
<button id="jump">跳</button>
<div id="bar"></div>
<div id="toast" hidden></div>

<div class="ov" id="craftOv" hidden><div class="box"><h2>合成<button id="craftX">✕</button></h2><p id="craftHint"></p><div id="recs"></div></div></div>
<div class="ov" id="menuOv" hidden><div class="box">
  <h2>方块拓荒<button id="menuX">✕</button></h2>
  <div class="how">
    <b>移动</b>：手机用左下摇杆和右下「跳」；电脑用 A/D 和 W/空格。<br>
    <b>挖</b>：底栏选中镐子，按住方块不放。<b>放</b>：底栏选中方块，点或拖过空位。<b>墙</b>是背景，不挡路，用来把房子围起来。<br>
    <b>合成</b>：右上「合成」。先砍树做木板和工作台，再做石镐去挖铁；熔炉炼锭。<b>床</b>：点一下设为重生点，夜里点可以睡到天亮。<br>
    夜里和洞里会有怪物，选中剑点屏幕挥砍；屋里放上火把就安全多了。
  </div>
  <div class="btns">
    <button class="primary" id="resumeBtn">继续</button>
    <button id="modeBtn"></button>
    <button id="sndBtn"></button>
    <button id="newBtn">新世界</button>
    <a class="pill" href="../index.html" style="padding:8px 16px">‹ 大厅</a>
  </div>
</div></div>

<script src="../shared/monsters.js"></script>
<script>
'use strict';
/* =====================================================================
   方块拓荒 — 2D 横版沙盒。结构：数据(方块/物品/配方) → 世界生成 → 逻辑 step(dt) → 渲染(区块缓存 + 光照) → 界面/输入/存档。
   加方块：TILE 里加一项 + art() 里加画法；加物品：ITEMS；加配方：RECIPES。
   ===================================================================== */
const $=id=>document.getElementById(id);
const M=Monsters,OL=M.OL;
const T=32,WW=320,WH=110,CH=8,REACH=5.6;
// 方块：s 实心，h 硬度(秒，木镐)，tier 需要的镐等级，drop 掉落物品，light 发光
const TILE=[
 {k:'air'},
 {k:'dirt',s:1,h:.28,drop:'dirt'},{k:'grass',s:1,h:.3,drop:'dirt'},{k:'stone',s:1,h:.75,drop:'stone'},{k:'sand',s:1,h:.22,drop:'sand'},
 {k:'log',s:1,h:.45,drop:'log'},{k:'plank',s:1,h:.4,drop:'plank'},{k:'brick',s:1,h:.8,drop:'brick'},{k:'glass',s:1,h:.25,drop:'glass',clear:1},
 {k:'coal',s:1,h:.9,drop:'coal'},{k:'iron',s:1,h:1.2,tier:2,drop:'ironore'},{k:'gold',s:1,h:1.5,tier:3,drop:'goldore'},{k:'crys',s:1,h:1.8,tier:3,drop:'crystal',light:.4},
 {k:'bedrock',s:1,h:1e9},
 {k:'bench',h:.4,drop:'bench'},{k:'furnace',h:.6,drop:'furnace',light:.55},{k:'torch',h:.05,drop:'torch',light:.95},
 {k:'door',s:1,h:.4,drop:'door',clear:1},{k:'dooro',h:.4,drop:'door'},{k:'plat',h:.25,drop:'plat',plat:1},{k:'bed',h:.4,drop:'bed'},
 {k:'trunk',h:.5,drop:'log'},{k:'leaf',h:.12},{k:'table',h:.3,drop:'table'},{k:'chair',h:.3,drop:'chair'},{k:'lamp',h:.3,drop:'lamp',light:1},{k:'flower',h:.03},
];
const B=Object.fromEntries(TILE.map((t,i)=>[t.k,i]));
const WALL=[null,{k:'wwall',drop:'wwall'},{k:'swall',drop:'swall'}];
// 物品：place 放成方块，wall 放成背景墙，pick 镐等级，sword 伤害
const ITEMS={
 pick1:{n:'木镐',pick:1},pick2:{n:'石镐',pick:2},pick3:{n:'铁镐',pick:3},pick4:{n:'金镐',pick:4},
 sword1:{n:'木剑',sword:8},sword2:{n:'石剑',sword:14},sword3:{n:'铁剑',sword:24},
 dirt:{n:'泥土',place:B.dirt},stone:{n:'石头',place:B.stone},sand:{n:'沙子',place:B.sand},log:{n:'原木',place:B.log},plank:{n:'木板',place:B.plank},
 brick:{n:'石砖',place:B.brick},glass:{n:'玻璃',place:B.glass},wwall:{n:'木墙',wall:1},swall:{n:'石墙',wall:2},plat:{n:'木平台',place:B.plat},door:{n:'木门',place:B.door},
 torch:{n:'火把',place:B.torch},bench:{n:'工作台',place:B.bench},furnace:{n:'熔炉',place:B.furnace},bed:{n:'床',place:B.bed},table:{n:'桌子',place:B.table},chair:{n:'椅子',place:B.chair},lamp:{n:'水晶灯',place:B.lamp},
 coal:{n:'煤'},ironore:{n:'铁矿'},goldore:{n:'金矿'},crystal:{n:'水晶'},iron:{n:'铁锭'},gold:{n:'金锭'},
};
const ORDER=Object.keys(ITEMS);
// 配方：out [物品,数量]，in {物品:数量}，at 需要靠近的设施
const RECIPES=[
 {out:['plank',4],in:{log:1}},{out:['bench',1],in:{plank:10}},{out:['torch',4],in:{plank:1,coal:1}},
 {out:['wwall',4],in:{plank:1}},{out:['plat',2],in:{plank:1}},{out:['door',1],in:{plank:6}},
 {out:['sword1',1],in:{plank:7},at:'bench'},{out:['pick2',1],in:{plank:3,stone:8},at:'bench'},{out:['sword2',1],in:{plank:2,stone:8},at:'bench'},
 {out:['furnace',1],in:{stone:20},at:'bench'},{out:['brick',4],in:{stone:4},at:'bench'},{out:['swall',4],in:{stone:1},at:'bench'},
 {out:['table',1],in:{plank:8},at:'bench'},{out:['chair',1],in:{plank:4},at:'bench'},{out:['bed',1],in:{plank:12},at:'bench'},
 {out:['iron',1],in:{ironore:3,coal:1},at:'furnace'},{out:['gold',1],in:{goldore:3,coal:1},at:'furnace'},{out:['glass',2],in:{sand:2},at:'furnace'},
 {out:['pick3',1],in:{plank:3,iron:6},at:'bench'},{out:['sword3',1],in:{plank:2,iron:6},at:'bench'},{out:['pick4',1],in:{plank:3,gold:6},at:'bench'},
 {out:['lamp',1],in:{crystal:3,gold:1},at:'bench'},
];
const PICK_SPEED=[0,1,1.7,2.6,3.6];
const DAY=480;   // 一昼夜的秒数

/* ---------- 音效 ---------- */
const AU={ctx:null,on:true,last:{}};try{AU.on=localStorage.getItem('arcade-craft-sound')!=='0'}catch(e){}
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}if(!AU.on)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{AU.ctx=new C();AU.out=AU.ctx.createGain();AU.out.gain.value=.35;AU.out.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
function tone(n,type,f0,f1,dur,vol,gap){if(!AU.on||!AU.ctx)return;const c=AU.ctx,t=c.currentTime;if(t-(AU.last[n]||0)<(gap||.05))return;AU.last[n]=t;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.02)}

/* ---------- 世界 ---------- */
let S=null;                     // 整个存档状态
let tiles,walls,h0;             // 前景方块、背景墙、原始地表高度
const idx=(x,y)=>y*WW+x,inb=(x,y)=>x>=0&&x<WW&&y>=0&&y<WH;
const tAt=(x,y)=>inb(x,y)?tiles[idx(x,y)]:(y<0?0:B.bedrock);
const solid=(x,y)=>!!TILE[tAt(x,y)].s;
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*1442695041)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function genWorld(seed){
  tiles=new Uint8Array(WW*WH);walls=new Uint8Array(WW*WH);h0=new Uint8Array(WW);
  let s=seed>>>0;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const p=[R()*9,R()*9,R()*9],desert=40+(R()*(WW-120)|0);
  for(let x=0;x<WW;x++){
    const h=Math.round(36+6*Math.sin(x/23+p[0])+3*Math.sin(x/9+p[1])+1.5*Math.sin(x/4+p[2]));h0[x]=h;const sandy=x>=desert&&x<desert+46,dd=4+(hash2(x,0,seed)*3|0);
    for(let y=h;y<WH;y++){let t=y===h?(sandy?B.sand:B.grass):y<h+dd?(sandy?B.sand:B.dirt):B.stone;
      if(t===B.stone&&vnoise(x/7,y/7,seed+5)>.72&&y<h+30)t=B.dirt;
      if(y>h+6&&vnoise(x/11,y/8,seed)>.63)t=B.air;
      if(y>=WH-2)t=B.bedrock;tiles[idx(x,y)]=t}
  }
  for(let i=0;i<34;i++){let x=R()*WW,y=h0[x|0]+8+R()*(WH-h0[x|0]-14),a=R()*6.283,r=1.3+R()*1.3;   // 蜿蜒的洞道
    for(let k=0;k<70+R()*60;k++){a+=(R()-.5)*.7;x+=Math.cos(a)*1.1;y+=Math.sin(a)*.55;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const tx=x+dx|0,ty=y+dy|0;if(dx*dx+dy*dy<=r*r&&inb(tx,ty)&&ty>h0[tx]+4&&ty<WH-2)tiles[idx(tx,ty)]=B.air}}}
  const vein=(t,n,minD,size)=>{for(let i=0;i<n;i++){let x=R()*WW|0,y=h0[x]+minD+(R()*(WH-h0[x]-minD-3)|0);for(let k=0;k<size;k++){if(inb(x,y)&&tiles[idx(x,y)]===B.stone)tiles[idx(x,y)]=t;x+=(R()*3|0)-1;y+=(R()*3|0)-1}}};
  vein(B.coal,150,5,6);vein(B.iron,95,14,5);vein(B.gold,55,34,4);vein(B.crys,40,48,4);
  for(let x=4;x<WW-4;){const h=h0[x];if(tiles[idx(x,h)]===B.grass&&Math.abs(h0[x-1]-h)<2&&Math.abs(h0[x+1]-h)<2){const th=4+(R()*4|0);
      for(let k=1;k<=th;k++)tiles[idx(x,h-k)]=B.trunk;const ty=h-th;
      for(let dy=-3;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){if(Math.abs(dx)+Math.abs(dy+1)*.8<3.2&&inb(x+dx,ty+dy)&&tiles[idx(x+dx,ty+dy)]===B.air)tiles[idx(x+dx,ty+dy)]=B.leaf}
      x+=5+(R()*5|0)}else x++}
  for(let x=1;x<WW-1;x++){const h=h0[x];if(tiles[idx(x,h)]===B.grass&&tiles[idx(x,h-1)]===B.air&&R()<.14)tiles[idx(x,h-1)]=B.flower}
}
// 存档：方块用行程编码 + base64
function rle(a){const o=[];for(let i=0;i<a.length;){let v=a[i],n=1;while(i+n<a.length&&a[i+n]===v&&n<255)n++;o.push(n,v);i+=n}let s='';for(let i=0;i<o.length;i+=8000)s+=String.fromCharCode.apply(null,o.slice(i,i+8000));return btoa(s)}
function unrle(str,len){const s=atob(str),a=new Uint8Array(len);let p=0;for(let i=0;i<s.length;i+=2){const n=s.charCodeAt(i),v=s.charCodeAt(i+1);a.fill(v,p,p+n);p+=n}return a}
const SAVE='arcade-craft-world';
function save(){if(!S)return;try{localStorage.setItem(SAVE,JSON.stringify({v:1,S:Object.assign({},S,{mobs:[],fx:[],mine:null}),t:rle(tiles),w:rle(walls),h:Array.from(h0)}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(!d||d.v!==1||!d.S||!d.t)return false;tiles=unrle(d.t,WW*WH);walls=unrle(d.w,WW*WH);h0=Uint8Array.from(d.h);S=d.S;S.mobs=[];S.fx=[];S.mine=null;
  for(const k in S.inv)if(!ITEMS[k])delete S.inv[k];if(!ITEMS[S.sel])S.sel='pick1';return true}catch(e){return false}}
function newWorld(creative){
  const seed=Math.random()*1e9|0;genWorld(seed);const sx=WW/2|0;
  S={seed,creative:!!creative,time:DAY*.3,p:{x:sx*T+T/2,y:(h0[sx]-1)*T,vx:0,vy:0,hp:100,face:1,inv:0,walk:0,swing:0,hurtT:9},spawn:[sx,h0[sx]-1],inv:{pick1:1},sel:'pick1',mobs:[],fx:[],mine:null,spawnT:4};
  for(let dy=1;dy<=3;dy++)for(let dx=-1;dx<=1;dx++){const i=idx(sx+dx,h0[sx]-dy);if(tiles[i]!==B.air)tiles[i]=B.air}
  chunks.clear();save();
}

/* ---------- 物品 / 合成 ---------- */
const count=k=>S.creative&&k!=='pick1'?(ITEMS[k].pick||ITEMS[k].sword?1:999):S.inv[k]||0;
function give(k,n){S.inv[k]=(S.inv[k]||0)+n;barDirty=true}
function take(k,n){if(S.creative)return;S.inv[k]-=n;if(S.inv[k]<=0){delete S.inv[k];if(S.sel===k)S.sel=bestPick()}barDirty=true}
const bestPick=()=>['pick4','pick3','pick2','pick1'].find(k=>count(k)>0)||'pick1';
const pickTier=()=>S.creative?4:ITEMS[bestPick()].pick;
function near(tile){const px=S.p.x/T|0,py=(S.p.y-20)/T|0;for(let y=py-4;y<=py+4;y++)for(let x=px-5;x<=px+5;x++)if(tAt(x,y)===tile)return true;return false}
function canCraft(r){if(r.at&&!near(B[r.at]))return false;for(const k in r.in)if(count(k)<r.in[k])return false;return true}
function craft(i){const r=RECIPES[i];if(!r||!canCraft(r))return false;for(const k in r.in)take(k,r.in[k]);give(r.out[0],r.out[1]);if(ITEMS[r.out[0]].pick)S.sel=r.out[0];tone('craft','triangle',520,880,.12,.2);barDirty=true;return true}

/* ---------- 挖与放 ---------- */
let chunks=new Map(),lightDirty=true,barDirty=true;
function touch(x,y){for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const cx=Math.floor((x+dx)/CH),cy=Math.floor((y+dy)/CH);chunks.delete(cx+','+cy)}lightDirty=true}
function setT(x,y,t){if(!inb(x,y))return;tiles[idx(x,y)]=t;touch(x,y)}
const inReach=(x,y)=>Math.hypot((x+.5)*T-S.p.x,(y+.5)*T-(S.p.y-22))<=REACH*T||S.creative;

function debris(x,y,t){const c=TCOL[t]||'#888';for(let i=0;i<5;i++)S.fx.push({k:'p',x:(x+.5)*T,y:(y+.5)*T,vx:(Math.random()-.5)*160,vy:-60-Math.random()*120,r:2+Math.random()*2.5,t:0,life:.4+Math.random()*.3,col:c})}
function breakTile(x,y){
  const t=tAt(x,y),d=TILE[t];if(!t||d.h>1e8)return;
  if(t===B.trunk){let n=0,yy=y;while(tAt(x,yy)===B.trunk){setT(x,yy,0);n++;for(let dy=-3;dy<=1;dy++)for(let dx=-2;dx<=2;dx++)if(tAt(x+dx,yy+dy)===B.leaf&&!hasTrunkNear(x+dx,yy+dy,x))setT(x+dx,yy+dy,0);yy--}
    if(!S.creative)give('log',n);popup(x,y,'+'+n+' 原木');debris(x,y,t);return}
  if(t===B.door||t===B.dooro){for(const yy of[y-1,y+1])if(tAt(x,yy)===B.door||tAt(x,yy)===B.dooro)setT(x,yy,0)}
  setT(x,y,0);debris(x,y,t);if(d.drop&&!S.creative){give(d.drop,1);popup(x,y,'+1 '+ITEMS[d.drop].n)}
  if(tAt(x,y-1)===B.flower||tAt(x,y-1)===B.torch&&!solid(x-1,y-1)&&!solid(x+1,y-1)&&!walls[idx(x,y-1)])breakTile(x,y-1);
}
function hasTrunkNear(x,y,skipX){for(let dy=-1;dy<=3;dy++)for(let dx=-2;dx<=2;dx++)if(x+dx!==skipX&&tAt(x+dx,y+dy)===B.trunk)return true;return false}
function playerHits(x,y){const p=S.p;return (x+1)*T>p.x-9&&x*T<p.x+9&&(y+1)*T>p.y-42&&y*T<p.y}
function canPlace(x,y,t){
  if(!inb(x,y)||tAt(x,y)!==B.air&&tAt(x,y)!==B.flower&&tAt(x,y)!==B.leaf||!inReach(x,y))return false;
  if(TILE[t].s&&playerHits(x,y))return false;
  if(S.mobs.some(m=>TILE[t].s&&Math.abs(m.x-(x+.5)*T)<T*.6&&Math.abs(m.y-10-(y+.5)*T)<T*.7))return false;
  return walls[idx(x,y)]>0||[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const n=tAt(x+dx,y+dy);return n&&n!==B.leaf&&n!==B.flower})||y>h0[x];
}
function useAt(x,y,first){

    if(t===B.door||t===B.dooro){if(!inReach(x,y))return;const to=t===B.door?B.dooro:B.door;let ys=[y];for(const yy of[y-1,y+1])if(tAt(x,yy)===t)ys.push(yy);
      if(to===B.door&&ys.some(yy=>playerHits(x,yy)))return;ys.forEach(yy=>setT(x,yy,to));tone('door','square',to===B.door?180:260,120,.06,.15);return'done'}
    if(t===B.bed&&inReach(x,y)){S.spawn=[x,y];const night=dayK()<.5;if(night&&!S.mobs.some(m=>Math.hypot(m.x-p.x,m.y-p.y)<T*8)){S.time=Math.ceil(S.time/DAY)*DAY+DAY*.22;toast('一觉睡到天亮，重生点已设在这张床')}else toast(night?'附近有怪物，睡不着':'重生点已设在这张床');return'done'}
  }
  if(it.sword){if(p.swing<=0){p.swing=.3;tone('sw','triangle',700,300,.08,.12);for(const m of S.mobs){const dx=m.x-p.x;if(dx*p.face>-10&&Math.abs(dx)<62&&Math.abs(m.y-p.y)<60)hitMob(m,it.sword,p.face)}}return}
  if(it.pick){

      if(!S.mine||S.mine.x!==x||S.mine.y!==y)S.mine={x,y,t:0,need:S.creative?.05:d.h/PICK_SPEED[it.pick]};p.swing=Math.max(p.swing,.12)}
    else if(walls[idx(x,y)]){if(!S.mine||S.mine.x!==x||S.mine.y!==y||!S.mine.wall)S.mine={x,y,t:0,need:S.creative?.05:.3,wall:1};p.swing=Math.max(p.swing,.12)}
    return}
  if(count(S.sel)<=0)return;
  if(it.wall){if(inb(x,y)&&!walls[idx(x,y)]&&inReach(x,y)&&(tAt(x,y)||[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>inb(x+dx,y+dy)&&(walls[idx(x+dx,y+dy)]||tAt(x+dx,y+dy)))||y>h0[x])){walls[idx(x,y)]=it.wall;touch(x,y);take(S.sel,1);tone('pl','sine',300,200,.05,.12,.04)}return}

    if(pt===B.door){const y2=canPlace(x,y,pt)&&canPlace(x,y-1,pt)?y-1:canPlace(x,y,pt)&&canPlace(x,y+1,pt)?y+1:null;if(y2==null||!(solid(x,Math.max(y,y2)+1)))return;setT(x,y,pt);setT(x,y2,pt);take(S.sel,1);tone('pl','sine',300,200,.05,.12,.04);return}
    if(!canPlace(x,y,pt))return;

}
function hitMob(m,d,dir){m.hp-=d;m.hit=.15;m.vx=dir*180;m.vy=-160;tone('hit','square',240,120,.06,.14);if(m.hp<=0){m.dead=true;for(let i=0;i<8;i++)S.fx.push({k:'p',x:m.x,y:m.y-12,vx:(Math.random()-.5)*220,vy:-Math.random()*200,r:2+Math.random()*3,t:0,life:.5,col:MOB[m.id].col})}}

function collide(e,w,h,dt,fly){
  // 先横后竖，逐轴解决
  e.x+=e.vx*dt;let x0=Math.floor((e.x-w)/T),x1=Math.floor((e.x+w-.01)/T),y0=Math.floor((e.y-h)/T),y1=Math.floor((e.y-.01)/T);e.hitWall=false;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(solid(x,y)){if(e.vx>0)e.x=x*T-w;else if(e.vx<0)e.x=(x+1)*T+w;e.hitWall=true;e.vx=0;x0=Math.floor((e.x-w)/T);x1=Math.floor((e.x+w-.01)/T)}
  const py=e.y;e.y+=e.vy*dt;e.ground=false;x0=Math.floor((e.x-w)/T);x1=Math.floor((e.x+w-.01)/T);y0=Math.floor((e.y-h)/T);y1=Math.floor((e.y-.01)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=tAt(x,y),d=TILE[t];
    if(d.s){if(e.vy>0){e.y=y*T;e.ground=true}else if(e.vy<0)e.y=(y+1)*T+h;e.vy=0;y0=Math.floor((e.y-h)/T);y1=Math.floor((e.y-.01)/T)}
    else if(d.plat&&e.vy>0&&py<=y*T+1&&!e.drop){e.y=y*T;e.vy=0;e.ground=true}}
  e.x=Math.max(w,Math.min(WW*T-w,e.x));
}
const MOB={slime:{col:'#7bd65a',hp:20,dmg:8,sp:60,r:13},skel:{col:'#e2dccb',hp:36,dmg:14,sp:78,r:14},bat:{col:'#9468dc',hp:14,dmg:7,sp:95,r:11,fly:1},spider:{col:'#c04866',hp:22,dmg:10,sp:100,r:11}};
const dayK=()=>{const a=(S.time%DAY)/DAY;return Math.max(0,Math.min(1,.5+Math.sin(a*6.283-.4)*1.6))};   // 1 白天 … 0 深夜
let input={mx:0,jump:false,down:false},ptr=null;
function step(dt){
  if(!S||paused)return;const p=S.p;S.time+=dt;
  // 玩家
  const fly=S.creative;p.vx=input.mx*(fly?260:175);
  if(fly){p.vy=input.jump?-260:input.down?260:0}
  else{p.vy=Math.min(900,p.vy+1500*dt);if(input.jump&&p.ground){p.vy=-490;tone('jump','sine',300,520,.08,.08)}}
  p.drop=input.down;collide(p,9,42,dt);
  if(!fly&&p.hitWall&&p.ground&&input.mx){const tx=Math.floor((p.x+input.mx*14)/T),ty=Math.floor((p.y-1)/T);if(solid(tx,ty)&&!solid(tx,ty-1)&&!solid(tx,ty-2)&&!solid(Math.floor(p.x/T),ty-2))p.vy=-360}   // 一格高的台阶自动跨上去
  if(input.mx){p.walk+=dt*11;if(!ptr)p.face=input.mx>0?1:-1}
  if(p.swing>0)p.swing-=dt;if(p.inv>0)p.inv-=dt;p.hurtT+=dt;if(p.hurtT>5&&p.hp<100)p.hp=Math.min(100,p.hp+dt*2);
  if(p.y>WH*T+200){p.hp=0}
  // 按住屏幕持续使用
  if(ptr&&ptr.down){const w=toWorld(ptr.sx,ptr.sy),tx=Math.floor(w.x/T),ty=Math.floor(w.y/T);if(ptr.last!==tx+','+ty||ITEMS[S.sel].pick||ITEMS[S.sel].sword){const r=useAt(tx,ty,ptr.first);ptr.first=false;ptr.last=tx+','+ty;if(r==='done')ptr.down=false}}
  if(S.mine){const m=S.mine,w=ptr&&ptr.down?toWorld(ptr.sx,ptr.sy):null;
    if(!w||Math.floor(w.x/T)!==m.x||Math.floor(w.y/T)!==m.y||!ITEMS[S.sel].pick)S.mine=null;
    else{m.t+=dt;tone('dig','square',160+Math.random()*60,90,.04,.08,.12);if(m.t>=m.need){if(m.wall){const wd=WALL[walls[idx(m.x,m.y)]];walls[idx(m.x,m.y)]=0;touch(m.x,m.y);if(wd&&!S.creative)give(wd.drop,1)}else breakTile(m.x,m.y);S.mine=null;tone('brk','triangle',220,80,.08,.2)}}}
  // 怪物
  if(!S.creative){S.spawnT-=dt;if(S.spawnT<=0){S.spawnT=2.5;trySpawn()}}
  for(const m of S.mobs){const d=MOB[m.id];if(m.hit>0)m.hit-=dt;const dx=p.x-m.x,dy=(p.y-20)-(m.y-10),dist=Math.hypot(dx,dy);m.face=dx>0?1:-1;
    if(d.fly){const k=d.sp/(dist||1);m.vx+=(dx*k-m.vx)*dt*3;m.vy+=(dy*k+Math.sin(S.time*6+m.ph)*40-m.vy)*dt*3;collide(m,d.r*.7,d.r*1.4,dt)}
    else{if(m.hit<=0)m.vx+=(Math.sign(dx)*d.sp-m.vx)*Math.min(1,dt*6);m.vy=Math.min(900,m.vy+1500*dt);collide(m,d.r*.7,d.r*1.6,dt);
      if(m.ground&&(m.hitWall||m.id==='slime'&&(m.hop-=dt)<=0)){m.vy=-430;m.hop=.9+Math.random()*.8}}
    if(dist<d.r+16&&p.inv<=0&&m.hit<=0){p.hp-=d.dmg;p.inv=.8;p.hurtT=0;p.vx=Math.sign(-dx||1)*220;p.vy=-240;shake=.2;tone('hurt','sawtooth',220,90,.18,.22)}
    if(dist>T*46||(m.id==='skel'&&dayK()>.8&&m.y<h0[Math.max(0,Math.min(WW-1,m.x/T|0))]*T+T))m.dead=true}
  S.mobs=S.mobs.filter(m=>!m.dead);
  if(p.hp<=0){p.hp=100;p.x=(S.spawn[0]+.5)*T;p.y=(S.spawn[1]+1)*T;p.vx=p.vy=0;p.inv=2;S.mobs=[];toast('你倒下了，回到了重生点');for(let k=0;k<3&&solid(p.x/T|0,(p.y-10)/T|0);k++)p.y-=T}
  for(const f of S.fx){f.t+=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=500*dt}}S.fx=S.fx.filter(f=>f.t<f.life);
  if(shake>0)shake-=dt;
}
function trySpawn(){

function computeLight(){
  const x0=Math.floor(cam.x/T)-9,y0=Math.floor(cam.y/T)-9,w=Math.ceil(vw()/T)+19,h=Math.ceil(vh()/T)+19;
  if(!L||LW!==w||LH!==h){L=new Float32Array(w*h);lc=mkc(w,h)}LX=x0;LY=y0;LW=w;LH=h;L.fill(0);const sky=.22+.78*dayK();

  for(let i=0;i<w;i++){const x=x0+i;if(x<0||x>=WW)continue;let open=true;for(let yy=Math.min(y0,WH)-1;yy>=0&&open;yy--)if(blocks(x,yy))open=false;   // 这一列从天上到视野顶端有没有被挡住
    for(let j=0;j<h;j++){const y=y0+j;if(y<0){L[j*w+i]=sky;continue}if(y>=WH)break;
      if(open){if(blocks(x,y))open=false;else L[j*w+i]=sky}

  const pi=Math.floor(S.p.x/T)-x0,pj=Math.floor((S.p.y-20)/T)-y0;if(pi>=0&&pj>=0&&pi<w&&pj<h)L[pj*w+pi]=Math.max(L[pj*w+pi],S.sel==='torch'&&count('torch')>0?.85:.3);

addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' ')e.preventDefault();keys[k]=true;keyMove();if(k==='e'){$('craftOv').hidden=!$('craftOv').hidden;if(!$('craftOv').hidden)buildCraft()}if(k==='escape'){if(!$('craftOv').hidden)$('craftOv').hidden=true;else setPaused(!paused)}
  if(k>='1'&&k<='9'){const b=$('bar').children[k-1];if(b)b.click()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keyMove()});
const spos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{audioInit();if(paused)return;const[sx,sy]=spos(e);ptr={id:e.pointerId,sx,sy,down:true,first:true,last:''};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const[sx,sy]=spos(e);if(ptr&&ptr.id===e.pointerId){ptr.sx=sx;ptr.sy=sy}else if(e.pointerType==='mouse'&&!(ptr&&ptr.down))ptr={id:e.pointerId,sx,sy,down:false,hover:true}});
const pup=e=>{if(ptr&&ptr.id===e.pointerId){ptr.down=false;if(e.pointerType!=='mouse')ptr=null;else ptr.hover=true}};cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('contextmenu',e=>e.preventDefault());
let joyX=0,joyDown=false,jumpHeld=false,joyId=null;const joy=$('joy');
function joyMove(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joyX=Math.abs(dx)<.22?0:Math.sign(dx)*Math.min(1,Math.abs(dx)*1.3);joyDown=dy>.6;$('joyI').style.transform=`translate(${dx*38}px,${dy*38}px)`;if(dy<-.65)jumpHeld=true;else if(joyUpJump){jumpHeld=false}joyUpJump=dy<-.65;keyMove()}
let joyUpJump=false;
joy.addEventListener('pointerdown',e=>{audioInit();joyId=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(_){}joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
const jup=e=>{if(e.pointerId===joyId){joyId=null;joyX=0;joyDown=false;if(joyUpJump)jumpHeld=false;joyUpJump=false;$('joyI').style.transform='';keyMove()}};joy.addEventListener('pointerup',jup);joy.addEventListener('pointercancel',jup);
const jb=$('jump');jb.addEventListener('pointerdown',e=>{audioInit();jumpHeld=true;jb.classList.add('dn');try{jb.setPointerCapture(e.pointerId)}catch(_){}keyMove()});
const jbu=()=>{jumpHeld=false;jb.classList.remove('dn');keyMove()};jb.addEventListener('pointerup',jbu);jb.addEventListener('pointercancel',jbu);
addEventListener('resize',resize);
setInterval(save,8000);document.addEventListener('visibilitychange',()=>{if(document.hidden){save();Object.keys(keys).forEach(k=>keys[k]=false);keyMove()}});addEventListener('pagehide',save);
let last=0,hudT=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;if(!S)return;step(dt);if(barDirty)buildBar();if((hudT+=dt)>.25){hudT=0;syncHUD()}render()}
try{localStorage.setItem('arcade-last','craft')}catch(e){}
buildArt();resize();
if(!load()){newWorld(false);setTimeout(()=>setPaused(true),50)}
buildBar();syncHUD();requestAnimationFrame(loop);
window.__busy=()=>true;
