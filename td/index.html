<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>守卫前线 · 塔防</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--ink:#0e0c12;--stone:#1d1a24;--stone-2:#2a2633;--line:#4a4356;--text:#efe6d0;--dim:#a79db3;--brass:#e3b558;--blood:#ef6a5e;--accent:#6fbf5f;
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{margin:0;background:var(--ink);color:var(--text);font:14px/1.5 'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(#35303f,#262230);border-radius:10px;padding:6px 12px;
  box-shadow:0 2px 0 #0008,inset 0 1px 0 #ffffff14;transition:transform .08s,filter .12s,border-color .12s}
button:not(:disabled):hover{filter:brightness(1.15)}
button:not(:disabled):active{transform:translateY(2px);box-shadow:0 0 0 #0008}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--dim);text-decoration:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;white-space:nowrap;background:#0006;box-shadow:none;display:inline-block}
.pill:hover{border-color:var(--brass);color:var(--brass)}
svg.i{width:16px;height:16px;vertical-align:-3px;flex:none}

/* ---------- 选关 ---------- */
#menu{min-height:100dvh;background:radial-gradient(ellipse 90% 60% at 50% 0%,color-mix(in srgb,var(--accent) 22%,#17131f) 0%,var(--ink) 70%);transition:background .3s}
#menu .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
#menu header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#menu h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);letter-spacing:.1em;line-height:1.1;
  background:linear-gradient(#ffe9a8,#d89a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009)}
#menu .sub{color:var(--dim);margin:6px 0 22px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.theme{position:relative;padding:0;height:112px;border-radius:16px;border:2px solid #0009;overflow:hidden;text-align:left;background:#000;box-shadow:0 6px 18px #0008}
.theme canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75) brightness(.6);transition:filter .2s,transform .3s}
.theme:hover canvas{transform:scale(1.06)}
.theme .tx{position:absolute;inset:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 10%,#000c)}
.theme b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 #000}
.theme span{font-size:12px;color:#ddd;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme em{position:absolute;top:10px;right:12px;font-style:normal;font-size:12.5px;color:var(--brass);background:#000a;border-radius:999px;padding:1px 10px}
.theme.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 8px 26px color-mix(in srgb,var(--c) 45%,transparent)}
.theme.on canvas{filter:none}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.lv{position:relative;padding:0;border-radius:16px;overflow:hidden;background:var(--stone);text-align:left;border:2px solid #0009;box-shadow:0 6px 18px #0008}
.lv:not(:disabled):hover{transform:translateY(-4px);border-color:var(--accent);filter:none;box-shadow:0 12px 28px #000a}
.lv canvas{display:block;width:100%;aspect-ratio:896/606}
.lv .no{position:absolute;left:10px;top:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;
  background:var(--accent);color:#14110a;border:2px solid #000a;box-shadow:0 2px 0 #0008}
.lv .meta{padding:10px 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(#2a2633,#1d1a24)}
.lv .meta b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.06em}
.lv .meta small{display:block;color:var(--dim);font-size:12px}
.stars{color:var(--brass);letter-spacing:2px;font-size:17px;white-space:nowrap;text-shadow:0 1px 0 #000}
.stars s{color:#4a4356;text-decoration:none}
.lv:disabled{opacity:1}
.lv:disabled canvas{filter:grayscale(1) brightness(.35)}
.lv .lock{position:absolute;left:0;right:0;top:0;aspect-ratio:896/606;display:grid;place-items:center}
.lv .lock svg{width:44px;height:44px;opacity:.85}
.lv:disabled .no{background:#4a4356;color:#bbb}
.howto{margin-top:26px;color:var(--dim);font-size:13px;background:#0005;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.howto b{color:var(--text)}

/* ---------- 对局 ---------- */
#game{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:radial-gradient(ellipse 80% 50% at 50% 0%,color-mix(in srgb,var(--accent) 16%,#17131f) 0%,var(--ink) 75%)}
.hud{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;max-width:1220px;width:100%;margin:0 auto}
.hud .name{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--accent);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000}
.chip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#2c2836,#1c1924);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 1px 0 #ffffff12,0 2px 0 #0007}
.chip b{font-weight:700;font-size:15px;min-width:1.4em;text-align:right}
.chip.hp b{color:#ff8a7e} .chip.gold b{color:var(--brass)}
.chip .bar{width:54px;height:6px;border-radius:3px;background:#0008;overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
canvas#cv{display:block;border-radius:14px;border:3px solid #000;outline:2px solid color-mix(in srgb,var(--accent) 55%,#4a4356);touch-action:none;cursor:pointer;background:#000;box-shadow:0 12px 40px #000c}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,.72);z-index:5;backdrop-filter:blur(3px)}
#overlay .box{background:linear-gradient(#2c2836,#1a1722);border:2px solid var(--brass);border-radius:18px;padding:22px 30px 24px;text-align:center;min-width:260px;box-shadow:0 20px 60px #000,inset 0 1px 0 #ffffff1c;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#overlay h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.1em;color:var(--brass);text-shadow:0 3px 0 #000}
#overlay .lose h2{color:var(--blood)}
#overlay .stars{font-size:44px;margin:6px 0 14px;letter-spacing:6px}
#overlay .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#overlay .btns button{padding:8px 18px}
.primary{background:linear-gradient(color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));border-color:#000a;color:#14110a;font-weight:700;text-shadow:0 1px 0 #ffffff55}
.bar{position:relative;display:flex;gap:8px;padding:10px 12px 12px;align-items:stretch;flex-wrap:wrap;max-width:1220px;width:100%;margin:0 auto}
#towerBtns{display:flex;gap:8px;flex:4 1 480px;min-width:0}
.tw{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;text-align:left;flex:1 1 0;min-width:0;max-width:210px;border-radius:14px}
.tw canvas{width:48px;height:48px;flex:none;border-radius:10px;background:radial-gradient(circle at 50% 35%,#4a4458,#1c1924);border:1px solid #000a}
.tw b{display:block;font-size:14px;line-height:1.25}
.tw small{display:inline-flex;align-items:center;gap:3px;color:var(--brass);font-size:12.5px;font-weight:700}
.tw em{display:block;font-style:normal;color:var(--dim);font-size:11px;line-height:1.2;white-space:nowrap}
.tw kbd{position:absolute;left:-4px;top:-6px;font:700 11px/1 system-ui;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--dim)}
.tw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 18px color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-3px)}
.tw.poor{filter:grayscale(.8) brightness(.8)} .tw.poor small{color:var(--blood)}
#selPanel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;z-index:4;max-width:calc(100% - 16px);box-shadow:0 10px 28px #000c;display:flex;align-items:center;gap:8px;background:linear-gradient(#2c2836,#1c1924);border:1px solid var(--brass);border-radius:14px;padding:6px 10px 6px 6px;flex-wrap:wrap}
#selPanel.top{bottom:auto;top:10px}
#selPanel button{white-space:nowrap;flex:none}
#selPanel canvas{width:48px;height:48px;border-radius:10px;background:radial-gradient(circle at 50% 35%,#4a4458,#1c1924);border:1px solid #000a}
#selPanel .info{margin-right:auto}
#selPanel .info b{font-size:15px}
#selPanel .info small{display:block;color:var(--dim);font-size:12px}
#deselBtn{padding:6px 10px}
.spells{display:flex;gap:8px;align-items:stretch}
.sp{position:relative;width:66px;padding:4px 0 3px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;overflow:hidden}
.sp svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 #0008)}
.sp small{color:var(--dim);font-size:10px}
.sp::after{content:'';position:absolute;inset:0;background:conic-gradient(#000c calc(var(--p,0)*1%),transparent 0);pointer-events:none}
.sp:disabled{opacity:.8}
.sp.on{border-color:#ff9a30;box-shadow:0 0 0 2px #ff9a30,0 0 16px #ff9a3088}
#waveBtn{flex:1 1 170px;min-height:58px;font-family:var(--display);font-size:22px;letter-spacing:.08em;border-radius:14px}
#waveBtn:not(:disabled){animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 2px 0 #0008,0 0 22px color-mix(in srgb,var(--accent) 80%,transparent)}}
#waveInfo{flex-basis:100%;color:var(--dim);font-size:12.5px;min-height:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#waveInfo span{display:inline-flex;align-items:center;gap:4px}
#waveInfo canvas{width:28px;height:28px}
/* ---------- 自适应 ---------- */
@media (pointer:coarse){.pill{padding:6px 12px}.sp{min-height:52px}}
/* 平板竖屏等中等宽度：塔卡片压紧一些 */
@media (max-width:900px){#towerBtns{flex:1 1 100%}.tw{max-width:none;padding:4px 8px 4px 4px}.tw em{display:none}.tw canvas{width:42px;height:42px}#waveBtn{font-size:19px;min-height:52px}}
/* 手机竖屏：顶栏两行，塔卡片改成上图下字四等分 */
@media (max-width:640px){
  .hud{gap:5px;padding:6px 8px}
  .hud .name{font-size:16px;flex:1 1 40%;min-width:0}
  .chip{padding:3px 10px 3px 6px;gap:4px}.chip b{font-size:13.5px;min-width:0}.chip .bar{display:none}
  .pill{font-size:12px}
  .stage{padding:0 4px}
  .bar{gap:6px;padding:6px 8px 8px}#towerBtns{gap:6px}
  .tw{flex-direction:column;gap:0;padding:4px 2px 3px;text-align:center}
  .tw b{font-size:12px}.tw kbd{display:none}
  .sp{width:58px}
  #waveBtn{flex:1 1 120px;font-size:18px;min-height:50px}
  #waveInfo{font-size:11.5px;gap:6px;min-height:24px}#waveInfo canvas{width:22px;height:22px}
  #selPanel{padding:5px 8px 5px 5px;gap:6px}#selPanel canvas{width:40px;height:40px}#selPanel button{padding:7px 10px}
  #menu .wrap{padding:14px 12px 40px}
  .themes{gap:8px}.theme{height:86px;border-radius:12px}.theme b{font-size:18px}.theme span{display:none}.theme em{top:6px;right:6px;font-size:11px;padding:0 7px}.theme .tx{padding:8px 10px}
  .levels{grid-template-columns:repeat(2,1fr);gap:10px}.lv .meta{padding:8px 10px;flex-direction:column;align-items:flex-start;gap:2px}.lv .meta b{font-size:16px}.lv .no{width:28px;height:28px;font-size:16px;left:6px;top:6px}
}
/* 手机横屏（高度很矮）：状态栏放左侧、塔和技能放右侧，中间整高留给地图 */
@media (orientation:landscape) and (max-height:560px){
  #game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr)}
  .hud{flex-direction:column;flex-wrap:nowrap;align-items:stretch;width:112px;max-width:none;margin:0;padding:6px;gap:5px;overflow-y:auto}
  .hud .name{margin:0;flex:none;font-size:14px;white-space:normal;line-height:1.2}
  .chip{justify-content:space-between;padding:3px 10px 3px 6px}.chip b{font-size:13.5px}.chip .bar{display:none}
  .pill{text-align:center;padding:5px 4px;font-size:12px}
  .stage{padding:4px 0}
  .bar{flex-direction:column;flex-wrap:nowrap;width:132px;max-width:none;margin:0;padding:6px;gap:5px;overflow-y:auto}
  #towerBtns{flex:none;flex-direction:column;gap:5px}
  .tw{flex:none;flex-direction:row;text-align:left;gap:6px;padding:3px 6px 3px 3px}
  .tw canvas{width:34px;height:34px}.tw b{font-size:12px}.tw em,.tw kbd{display:none}
  .sp{flex:1;width:auto;min-height:40px;padding:2px 0}.sp svg{width:22px;height:22px}.sp small{display:none}
  #waveBtn{flex:none;min-height:46px;font-size:15px;letter-spacing:0}
  #waveInfo{display:none}
  #selPanel{flex-wrap:nowrap;padding:4px 8px 4px 4px;gap:6px}#selPanel canvas{display:none}#selPanel .info{padding-left:6px;min-width:0}#selPanel .info small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>

<div id="menu"><div class="wrap">
  <header>
    <a class="pill" href="../index.html">‹ 大厅</a>
    <h1>守卫前线</h1>
  </header>
  <p class="sub">在道路两旁布置守卫，拦下一波又一波的怪物。三片战场，十二道关卡。</p>
  <div class="themes" id="themes"></div>
  <div class="levels" id="levels"></div>
  <div class="howto">
    <b>玩法</b>：选择下方的守卫 → 点击空地放置 → 点「开始」放出下一波。点已放置的守卫可以升级或出售（返还 60%）。
    怪物走到城堡会扣生命，生命归零则失败；满血通关三星。<b>技能</b>：火雨（点地图落陨石）和冰封（冻结全场），各有冷却。<b>快捷键</b>：1–4 选塔，Q 火雨，W 冰封，空格开波，P 暂停，Esc 取消。
  </div>
</div></div>

<div id="game" hidden>
  <div class="hud">
    <button class="pill" id="backBtn">‹ 选关</button>
    <span class="name" id="lvName"></span>
    <span class="chip hp"><svg class="i" viewBox="0 0 16 16"><path d="M8 14S1.5 10 1.5 5.6A3.4 3.4 0 0 1 8 4.2a3.4 3.4 0 0 1 6.5 1.4C14.500 10 8 14 8 14z" fill="#ef6a5e" stroke="#000" stroke-width="1"/></svg><b id="hpV">20</b></span>
    <span class="chip gold"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#e3b558" stroke="#000"/><circle cx="8" cy="8" r="4" fill="none" stroke="#fff3" stroke-width="1.5"/></svg><b id="goldV">0</b></span>
    <span class="chip"><svg class="i" viewBox="0 0 16 16"><path d="M3 15V1.500M3 2h9l-2.500 3L12 8H3" fill="var(--accent)" stroke="#000" stroke-linejoin="round"/></svg><b id="waveV">0/0</b><span class="bar"><i id="waveBar"></i></span></span>
    <button class="pill" id="autoBtn">自动 关</button>
    <button class="pill" id="sndBtn">音效 开</button>
    <button class="pill" id="speedBtn">×1</button>
    <button class="pill" id="pauseBtn">暂停</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="selPanel" hidden>
      <canvas id="selIcon" width="96" height="96"></canvas>
      <div class="info"><b id="selName"></b><small id="selStat"></small></div>
      <button id="modeBtn" title="切换攻击目标"></button><button id="upBtn" class="primary"></button><button id="sellBtn"></button><button id="deselBtn">✕</button>
    </div>
    <div id="overlay" hidden><div class="box" id="ovBox">
      <h2 id="ovTitle"></h2><div id="ovText"></div><div class="stars" id="ovStars"></div>
      <div class="btns"><button id="ovNext" class="primary">下一关 ▶</button><button id="ovRetry">重玩</button><button id="ovMenu">选关</button></div>
    </div></div>
  </div>
  <div class="bar">
    <div id="towerBtns"></div>
    <div class="spells">
      <button class="sp" id="spFire" title="火雨 (Q)：点击地图落下陨石"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#ff8a2a" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/><path d="M12 12c1 2 2.5 2.5 2.5 4.5a2.5 2.5 0 0 1-5 0c0-1.5 1.5-2 2.5-4.5z" fill="#ffe14a"/></svg><span>火雨 <small>Q</small></span></button>
      <button class="sp" id="spIce" title="冰封 (W)：冻结全场怪物"><svg viewBox="0 0 24 24" fill="none" stroke="#9fe0ff" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M12 5.5l-2.5-2M12 5.5l2.5-2M12 18.5l-2.5 2M12 18.5l2.5 2"/></svg><span>冰封 <small>W</small></span></button>
    </div>
    <button id="waveBtn" class="primary"></button>
    <div id="waveInfo"></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   守卫前线 — 单文件塔防。结构：数据(主题/关卡/守卫/怪物) → 逻辑 step(dt) → 渲染 → UI。
   新增关卡：往 LEVELS 里加一项；新增主题：往 THEMES 里加一项。
   ===================================================================== */
const T=64, PADY=30, LC=14, LR=9;   // 关卡数据按横向 14×9 编写；PADY 是地图上方留出的一条边
// 竖屏时整张地图沿对角线翻转成 9×14（见 setOrient / flip），以下几个量随之变化
let COLS=LC, ROWS=LR, W=COLS*T, H=ROWS*T, VH=H+PADY, PORT=false;
function setOrient(p){PORT=p;COLS=p?LR:LC;ROWS=p?LC:LR;W=COLS*T;H=ROWS*T;VH=H+PADY}   // PADY：地图上方留出的一条边，给高塔和首领血条用
const $=id=>document.getElementById(id);

const THEMES={
  forest:{name:'翡翠森林',tag:'草木繁茂，路途曲折',accent:'#7fd060',
    ground:'#4a8f3c',path:'#d6b47a',edge:'#a8854e',pOut:'#4f3a20',cob:false,vig:.34,deco:['tree','pine','bush','rock'],rock:'#8d939c',
    mobs:{grunt:['史莱姆','#7bd65a','slime'],runner:['野狼','#a9b1ba','wolf'],tank:['树精','#9a6c3c','treant'],swarm:['毒蜂','#f0c838','bee'],boss:['森林巨魔','#4c9f78','troll']}},
  desert:{name:'灼热沙漠',tag:'开阔少遮挡，敌人更快',accent:'#f0b548',
    ground:'#e2c078',path:'#b98a58',edge:'#93683c',pOut:'#5c3d1e',cob:true,vig:.28,deco:['cactus','rock','skull','cactus'],rock:'#c79a62',
    mobs:{grunt:['沙虫','#d08f4c','worm'],runner:['毒蝎','#c44e34','scorpion'],tank:['木乃伊','#ddd6ba','mummy'],swarm:['圣甲虫','#4a7fc8','scarab'],boss:['沙漠法老','#e0a82e','pharaoh']}},

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const prepCache={};
function prep(L){
  const key=L.id+(PORT?'|p':'');if(prepCache[key])return prepCache[key];
  let P=prepCache[L.id];
  if(!P){
    const grid=new Uint8Array(LC*LR); // 0 空地 1 道路 2 装饰
    const paths=L.paths.map(wp=>{
      const pts=wp.map(([c,r])=>[(c+.5)*T,(r+.5)*T]),seg=[];let total=0;
      for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);total+=l;
        const [c0,r0]=wp[i-1],[c1,r1]=wp[i],n=Math.max(Math.abs(c1-c0),Math.abs(r1-r0));
        for(let k=0;k<=n;k++){const c=c0+Math.sign(c1-c0)*k,r=r0+Math.sign(r1-r0)*k;if(c>=0&&c<LC&&r>=0&&r<LR)grid[r*LC+c]=1}}
      return{pts,seg,total};
    });
    const R=rng(hash(L.id)),deco=[];
    for(let i=0;i<grid.length;i++)if(!grid[i]&&R()<.11){grid[i]=2;deco.push({c:i%LC,r:i/LC|0,k:R()*4|0,s:.85+R()*.35})}
    const noise=Array.from(grid,()=>R());
    const end=L.paths[0][L.paths[0].length-1];
    P=prepCache[L.id]={grid,paths,deco,noise,base:[(end[0]+.5)*T,(end[1]+.5)*T]};
  }
  if(!PORT)return P;
  // 竖屏版：同一份数据沿对角线翻转，保证两种朝向下可建造的格子完全对应
  const grid=new Uint8Array(LC*LR),noise=new Array(LC*LR);
  for(let r=0;r<LR;r++)for(let c=0;c<LC;c++){grid[c*LR+r]=P.grid[r*LC+c];noise[c*LR+r]=P.noise[r*LC+c]}
  return prepCache[key]={grid,noise,paths:P.paths.map(q=>({pts:q.pts.map(v=>[v[1],v[0]]),seg:q.seg,total:q.total})),deco:P.deco.map(d=>({...d,c:d.r,r:d.c})),base:[P.base[1],P.base[0]]};
}
// 对局中切换横竖屏：把整局状态翻转过去，不打断游戏
function flip(){
  setOrient(!PORT);if(!S)return;
  const sw=o=>{const t=o.x;o.x=o.y;o.y=t};
  S.P=prep(S.L);S.grid=S.P.grid.slice();
  for(const t of S.towers){sw(t);const c=t.c;t.c=t.r;t.r=c;t.ang=Math.PI/2-t.ang;S.grid[t.r*COLS+t.c]=3}
  for(const m of S.mobs){m.path=S.P.paths[m.pi||0];sw(m);const o=m.ox;m.ox=m.oy;m.oy=o}
  for(const q of S.shots){sw(q);const t=q.tx;q.tx=q.ty;q.ty=t}
  for(const f of S.fx){sw(f);if(f.vx!==undefined){const v=f.vx;f.vx=f.vy;f.vy=v}if(f.pts)f.pts=f.pts.map(v=>[v[1],v[0]])}
  S.decals.forEach(sw);S.meteors.forEach(sw);S.hover=S.pend=null;
}
function posAt(p,d){
  for(let i=0;i<p.seg.length;i++){if(d<=p.seg[i]||i===p.seg.length-1){const k=Math.min(1,d/p.seg[i]),a=p.pts[i],b=p.pts[i+1];return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}d-=p.seg[i]}
}
function genWaves(L){
  const out=[],np=L.paths.length;
  for(let w=1;w<=L.waves;w++){
    const ev=[];let t=0;const hp=L.hp*Math.pow(1.17,w-1);
    const add=(type,n,gap)=>{for(let i=0;i<n;i++){ev.push({t,type,hp,path:ev.length%np});t+=gap}t+=1.5};
    add('grunt',5+Math.floor(w*1.5),.8);
    if(w>=2&&w%2===0)add('runner',3+w,.5);
    if(w>=3&&w%3===0)add('tank',1+Math.floor(w/3),1.6);
    if(w%4===0||w%5===3)add('swarm',8+w,.3);
    if(w===L.waves)add('boss',L.boss||1,5);
    else if(L.waves>=10&&w===Math.floor(L.waves/2))add('boss',1,5);
    out.push(ev);
  }
  return out;
}

  S.fx.push({k:'part',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,g:160,r:2+Math.random()*3,t:0,life:.35+Math.random()*.3,col})}}

    S.shots.push({type:t.type,x:ox,y:oy,m,tx:m.x,ty:m.y,d0:Math.hypot(m.x-ox,m.y-oy)||1,z:0,dmg:crit?dmg*2:dmg,crit,lv:t.lv,tr:0,

    if(t.type==='cannon'){smoke(ox,oy,4,'#d8d2c8',40);S.shake=Math.max(S.shake,.05)}
    sfx(t.type==='archer'?'arrow':t.type==='cannon'?'cannon':'frost');
  }
}
// 技能：火雨（点地图落下 6 颗陨石）与冰封（全场冻结）
function castFire(x,y){if(!S||S.over||S.spell.fire>0)return false;S.spell.fire=FIRE_CD;S.cast=null;const dmg=(28+10*S.wave)*S.L.hp;
  for(let i=0;i<6;i++)S.meteors.push({x:x+(i?(Math.random()-.5)*1.7*T:0),y:y+(i?(Math.random()-.5)*1.7*T:0),t:-i*.13,dmg});S.dirty=true;sfx('cast');return true}
function castIce(){if(!S||S.over||S.spell.ice>0)return false;S.spell.ice=ICE_CD;
  for(const m of S.mobs){const boss=m.type==='boss';m.slowK=boss?.6:1;m.slow=boss?3:4;burst(m.x,m.y,'#d8f4ff',4,80)}
  S.fx.push({k:'icewave',x:W/2,y:H/2,t:0,life:.7});S.flash=.22;S.dirty=true;sfx('ice2');return true}
function step(dt){
  if(!S||S.paused||S.over)return;
  S.time+=dt;if(S.shake>0)S.shake-=dt;if(S.flash>0)S.flash-=dt;
  if(S.spell.fire>0)S.spell.fire=Math.max(0,S.spell.fire-dt);if(S.spell.ice>0)S.spell.ice=Math.max(0,S.spell.ice-dt);
  if(!S.active&&S.autoT>0){S.autoT-=dt;if(S.autoT<=0)nextWave()}
  if(S.active){S.waveT+=dt;while(S.queue.length&&S.queue[0].t<=S.waveT)spawn(S.queue.shift())}
  for(const m of S.mobs){
    if(m.slow>0)m.slow-=dt;if(m.hit>0)m.hit-=dt;
    m.d+=m.sp*(m.slow>0?1-m.slowK:1)*dt;
    const p=posAt(m.path,m.d),nx=p[0]+m.ox;if(Math.abs(nx-m.x)>.05)m.face=nx>m.x?1:-1;m.x=nx;m.y=p[1]+m.oy;
    if(m.d>=m.path.total){m.dead=true;S.lives=Math.max(0,S.lives-m.cost);S.dirty=true;S.shake=.25;sfx('leak');
      S.fx.push({k:'ring',x:S.P.base[0],y:S.P.base[1],r:T*1.1,t:0,life:.45,col:'#ff5a4a'},{k:'text',x:S.P.base[0],y:S.P.base[1]-50,txt:'-'+m.cost,t:0,life:.9,col:'#ff7a6a'})}
  }
  for(const t of S.towers){
    t.cd-=dt;if(t.flash>0)t.flash-=dt;
    if(t.cd>0)continue;
    const best=pick(t);if(best){fire(t,best);t.cd=TOWERS[t.type].rate}
  }
  for(const s of S.shots){
    if(s.type!=='cannon'&&!s.m.dead){s.tx=s.m.x;s.ty=s.m.y}
    const dx=s.tx-s.x,dy=s.ty-s.y,dist=Math.hypot(dx,dy),mv=s.sp*dt;
    if(s.type==='cannon')s.z=Math.sin(Math.min(1,Math.max(0,1-dist/s.d0))*Math.PI)*(26+s.d0*.2);   // 炮弹抛物线高度（仅视觉）
    s.tr+=dt;if(s.tr>.03){s.tr=0;
      if(s.type==='cannon')S.fx.push({k:'smoke',x:s.x,y:s.y-s.z,vx:0,vy:-8,g:0,r:3.5,t:0,life:.35,col:'#c8c2b8'});
      else if(s.type==='frost')S.fx.push({k:'part',x:s.x+(Math.random()-.5)*7,y:s.y+(Math.random()-.5)*7,vx:0,vy:12,g:0,r:2.6,t:0,life:.32,col:'#d8f4ff'})}
    if(dist<=mv+4){s.done=true;const d=TOWERS[s.type];
      if(s.type==='archer'){if(!s.m.dead){hurt(s.m,s.dmg,false,s.crit);S.fx.push({k:'spark',x:s.tx,y:s.ty,t:0,life:.18,col:s.crit?'#ffe14a':'#ffffff',r:s.crit?22:11});if(s.crit)burst(s.tx,s.ty,'#ffe14a',5,130)}}
      else if(s.type==='cannon'){splash(s.tx,s.ty,d.splash*T,m=>hurt(m,s.dmg));S.fx.push({k:'boom',x:s.tx,y:s.ty,r:d.splash*T,t:0,life:.4});
        S.decals.push({k:'scorch',x:s.tx,y:s.ty,r:d.splash*T*.7,t:0,life:5});burst(s.tx,s.ty,'#ffb040',9,170);smoke(s.tx,s.ty,4,'#6a6460',60);S.shake=Math.max(S.shake,.1);sfx('boom')}
      else{splash(s.tx,s.ty,d.splash*T,m=>{hurt(m,s.dmg);if(m.slowK>=1&&m.slow>0)return;const k=d.slow+.08*(s.lv-1);if(k>=m.slowK||m.slow<=0){m.slowK=k}m.slow=d.slowT});
        S.fx.push({k:'frost',x:s.tx,y:s.ty,r:d.splash*T,t:0,life:.45});S.decals.push({k:'ice',x:s.tx,y:s.ty,r:d.splash*T*.8,t:0,life:2.2});burst(s.tx,s.ty,'#cfefff',7,100);sfx('ice')}
    }else{s.x+=dx/dist*mv;s.y+=dy/dist*mv}
  }
  S.shots=S.shots.filter(s=>!s.done);
  for(const q of S.meteors){q.t+=dt;if(q.t>=.5){q.done=true;splash(q.x,q.y,T*1.05,m=>hurt(m,q.dmg,true));
    S.fx.push({k:'boom',x:q.x,y:q.y,r:T*1.25,t:0,life:.5});S.decals.push({k:'scorch',x:q.x,y:q.y,r:T*.85,t:0,life:6});burst(q.x,q.y,'#ffb040',10,210);smoke(q.x,q.y,5,'#5a5450',70);S.shake=.2;sfx('boom')}}
  S.meteors=S.meteors.filter(q=>!q.done);
  S.mobs=S.mobs.filter(m=>!m.dead);
  for(const f of S.fx){f.t+=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.g||0)*dt}}
  S.fx=S.fx.filter(f=>f.t<f.life);
  for(const d of S.decals)d.t+=dt;S.decals=S.decals.filter(d=>d.t<d.life);
  if(S.lives<=0){finish(false);return}
  if(S.active&&!S.queue.length&&!S.mobs.length){
    S.active=false;S.dirty=true;
    if(S.wave>=S.L.waves){finish(true);return}
    const bonus=20+5*S.wave;S.gold+=bonus;if(AUTO)S.autoT=2.5;
    S.fx.push({k:'text',x:W/2,y:H/2,txt:'清除！ +'+bonus,t:0,life:1.6,col:'#ffd76a',big:true});
  }
}
function finish(win){
  S.over=win?'win':'lose';S.dirty=true;sfx(win?'win':'lose');
  if(win){S.stars=S.lives>=START_LIVES?3:S.lives>=START_LIVES/2?2:1;
    if(!(progress[S.L.id]>=S.stars)){progress[S.L.id]=S.stars;saveProgress()}}
}

const OL='#1b1622';
function mix(c,t,k){const n=parseInt(c.slice(1),16),f=v=>Math.round(v+(t-v)*k);return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}

// 多个形状合并成一个带描边的剪影：先统一描边，再逐个填色
function union(g,shapes,lw){g.strokeStyle=OL;g.lineWidth=lw||5;g.lineJoin='round';for(const s of shapes){g.beginPath();s.p(g);g.stroke()}for(const s of shapes){g.fillStyle=s.c;g.beginPath();s.p(g);g.fill()}}

    g.strokeStyle='rgba(110,70,30,.35)';g.lineWidth=1.4;for(let i=0;i<12;i++){let x=rr(0,W),y=ry();g.beginPath();g.moveTo(x,y);for(let k=0;k<4;k++){x+=rr(-14,14);y+=rr(4,12);g.lineTo(x,y)}g.stroke()}
    for(let i=0;i<34;i++){const x=rr(0,W),y=ry();g.strokeStyle=R()<.5?'#a8843c':'#c4a050';g.lineWidth=1.8;g.beginPath();for(const a of[-.9,-.3,.3,.9]){g.moveTo(x,y);g.lineTo(x+Math.sin(a)*8,y-Math.cos(a)*9)}g.stroke()}

  }else{

      g.strokeStyle='rgba(150,170,255,.4)';g.lineWidth=1.6;g.beginPath();g.ellipse(x-w*.2,y-w*.08,w*.5,w*.18,0,3.4,5);g.stroke()}

  }
  // 道路：柔和投影 → 描边 → 路肩 → 路面，边缘用随机小圆打碎成自然的轮廓
  const trace=p=>{g.beginPath();p.pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()};
  const lay=(w,c)=>{g.strokeStyle=c;g.lineWidth=w;P.paths.forEach(trace)};

const STONE={archer:'#b79c74',cannon:'#8d8996',frost:'#9fbbd6',thunder:'#75658f'};

function rgba(c,a){const n=parseInt(c.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function glow(g,x,y,r,c,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(c,a));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function drawTower(g,type,x,y,ang,lv,flash,tm){

  // 塔身
  const gr=g.createLinearGradient(-w-5,0,w+5,0);gr.addColorStop(0,lite(st,.3));gr.addColorStop(.45,st);gr.addColorStop(1,dark(st,.38));
  g.fillStyle=gr;g.strokeStyle=OL;g.lineWidth=2.5;
  g.beginPath();g.moveTo(-w-5,20);g.lineTo(-w,h);g.lineTo(w,h);g.lineTo(w+5,20);g.quadraticCurveTo(0,31,-w-5,20);g.closePath();g.fill();g.stroke();
  g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.5;g.beginPath();
  for(const[bx,by,bw]of[[-11,h+7,7],[4,h+10,7],[-15,h+15,6],[9,h+17,6],[-8,h+22,6]])if(by<19){g.moveTo(bx,by);g.lineTo(bx+bw,by)}g.stroke();
  g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.moveTo(-w+2,h+3);g.lineTo(-w-1,18);g.stroke();
  g.fillStyle='#35261c';g.strokeStyle=OL;g.lineWidth=1.8;g.beginPath();g.roundRect(-4.5,14,9,12,[4.5,4.5,0,0]);g.fill();g.stroke();
  if(lv>=2){g.fillStyle=c;g.lineWidth=1.6;g.beginPath();poly(-5,h+2,5,h+2,5,h+13,0,h+10,-5,h+13)(g);g.fill();g.stroke();g.fillStyle=lv>=3?gold:lite(c,.5);g.beginPath();g.arc(0,h+6,1.8,0,7);g.fill()}
  // 垛口平台
  g.fillStyle=lite(st,.35);g.strokeStyle=OL;g.lineWidth=2.5;g.beginPath();g.roundRect(-pw,py,pw*2,9,3);g.fill();g.stroke();
  g.fillStyle='rgba(0,0,0,.2)';g.fillRect(-pw+2,py+6,pw*2-4,2);
  g.lineWidth=1.8;for(let i=0;i<4;i++){g.fillStyle=lv>=3?gold:lite(st,.5);g.beginPath();g.roundRect(-pw+1+i*((pw*2-9)/3),py-5,7,6,1.5);g.fill();g.stroke()}
  for(let i=0;i<lv;i++){const px=(i-(lv-1)/2)*8;g.fillStyle=gold;g.lineWidth=1.1;g.beginPath();poly(px,py+1.5,px+3,py+4.5,px,py+7.5,px-3,py+4.5)(g);g.fill();g.stroke()}

    g.translate(0,py-10);
    g.save();g.translate(0,2);g.rotate(ang);g.strokeStyle=OL;
    g.lineWidth=6;g.beginPath();g.arc(7,0,15,-1.15,1.15);g.stroke();g.strokeStyle=lv>=3?gold:'#a8703a';g.lineWidth=3;g.beginPath();g.arc(7,0,15,-1.15,1.15);g.stroke();
    g.strokeStyle='#f4f0e0';g.lineWidth=1.3;g.beginPath();g.moveTo(13.2,-13.7);g.lineTo(fl?13:3,0);g.lineTo(13.2,13.7);g.stroke();
    if(!fl){g.strokeStyle=OL;g.lineWidth=3.5;g.beginPath();g.moveTo(3,0);g.lineTo(27,0);g.stroke();g.strokeStyle='#e8dcc0';g.lineWidth=1.5;g.beginPath();g.moveTo(3,0);g.lineTo(26,0);g.stroke();
      g.fillStyle='#cfd4de';g.strokeStyle=OL;g.lineWidth=1;g.beginPath();poly(30,0,24,-3.5,24,3.5)(g);g.fill();g.stroke()}
    g.restore();
    g.strokeStyle=OL;g.lineWidth=2.5;g.fillStyle=c;
    g.beginPath();g.moveTo(-10,11);g.quadraticCurveTo(-12,-2,0,-3);g.quadraticCurveTo(12,-2,10,11);g.closePath();g.fill();g.stroke();
    g.fillStyle=lite(c,.3);g.beginPath();g.ellipse(-4,4,3,4.5,.3,0,7);g.fill();
    g.fillStyle='#f8dcbc';g.beginPath();g.arc(0,-8,8,0,7);g.fill();g.stroke();
    g.fillStyle='rgba(255,120,110,.45)';g.beginPath();g.arc(-5,-5.5,1.8,0,7);g.arc(5,-5.5,1.8,0,7);g.fill();
    g.fillStyle=OL;g.beginPath();g.arc(-3,-7.5,1.4,0,7);g.arc(3,-7.5,1.4,0,7);g.fill();
    g.fillStyle=dark(c,.12);g.beginPath();g.arc(0,-9,9,Math.PI,0);g.quadraticCurveTo(0,-13,-9,-9);g.fill();g.stroke();
    g.fillStyle='#ef5a4e';g.lineWidth=1.5;g.beginPath();g.moveTo(4,-16);g.quadraticCurveTo(13,-26,15,-17);g.quadraticCurveTo(10,-17,6,-13);g.closePath();g.fill();g.stroke();
  }else if(type==='cannon'){
    g.translate(0,py-2);
    g.fillStyle='#5d606e';g.strokeStyle=OL;g.lineWidth=2.5;g.beginPath();g.arc(0,0,14,Math.PI,0);g.closePath();g.fill();g.stroke();
    g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.arc(-5,-5,4,0,7);g.fill();
    g.save();g.translate(0,-6);g.rotate(ang);const k=fl?-5:0,L=lv>=2?31:27,th=lv>=3?9:14;
    const barrel=oy=>{const bg=g.createLinearGradient(0,oy-th/2,0,oy+th/2);bg.addColorStop(0,'#7b7e8c');bg.addColorStop(.5,'#3c3e49');bg.addColorStop(1,'#202128');
      g.fillStyle=bg;g.strokeStyle=OL;g.lineWidth=2.3;g.beginPath();g.roundRect(-5+k,oy-th/2,L,th,4);g.fill();g.stroke();
      g.fillStyle=lv>=2?'#d8a94a':'#8a8d9a';g.beginPath();g.roundRect(L-12+k,oy-th/2-1.5,6.5,th+3,2);g.fill();g.stroke();
      g.fillStyle=lv>=2?'#d8a94a':'#6a6d7a';g.fillRect(3+k,oy-th/2+1,3,th-2)};

    g.restore();

    g.fillStyle=lv>=3?gold:c;g.beginPath();g.arc(0,-6,2.8,0,7);g.fill();g.stroke();

    for(const s of[-1,1]){g.strokeStyle=OL;g.lineWidth=6;g.beginPath();g.moveTo(s*9,py);g.quadraticCurveTo(s*14,py-8,s*10,py-14);g.stroke();
      g.strokeStyle=lv>=3?gold:lite(st,.5);g.lineWidth=3;g.beginPath();g.moveTo(s*9,py);g.quadraticCurveTo(s*14,py-8,s*10,py-14);g.stroke()}

/* ---------- 怪物：每个主题 5 种，共 15 个独立造型。都在半径 15 的坐标系里朝右画 ---------- */
function E(g,x,y,rx,ry,fill,rot){g.fillStyle=fill;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();g.stroke()}
function PG(g,fill,p){g.fillStyle=fill;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill();g.stroke()}
function RR(g,x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();g.stroke()}
function dot(g,x,y,r,fill){g.fillStyle=fill;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function ln(g,col,lw,p){g.save();g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke();g.restore()}
function eyes(g,x,y,r,gap,pc){for(const ex of[x,x+gap]){g.fillStyle='#fff';g.beginPath();g.arc(ex,y,r,0,7);g.fill();g.stroke();dot(g,ex+r*.3,y,r*.52,pc||OL)}}
const FLY={bee:1,bat:1,pharaoh:1};
const SPR={
  slime(g,c,w,b){const sx=1+b*.07,sy=1-b*.08;
    g.fillStyle=c;g.beginPath();g.moveTo(-15*sx,7);g.bezierCurveTo(-15*sx,-18*sy,15*sx,-18*sy,15*sx,7);g.quadraticCurveTo(15*sx,13.5,0,13.5);g.quadraticCurveTo(-15*sx,13.5,-15*sx,7);g.fill();g.stroke();
    g.globalAlpha=.45;g.fillStyle=dark(c,.3);g.beginPath();g.ellipse(0,8.5,11,3.8,0,0,7);g.fill();g.globalAlpha=1;
    ln(g,OL,2.4,[0,-13*sy,1,-18*sy]);E(g,-3,-19*sy,4,2.2,'#4fae3c',-.5);E(g,5.5,-20*sy,4.5,2.4,'#6bcc52',.5);
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-7,-6,3.5,2.2,-.6,0,7);g.fill();
    eyes(g,1,-1+b,3.6,8);g.beginPath();g.arc(5,5+b,3,.2,2.94);g.stroke()},
  wolf(g,c,w,b){const lg=dark(c,.3);
    g.fillStyle=c;g.beginPath();g.moveTo(-11,0);g.quadraticCurveTo(-23,-4+w*2,-19,-13);g.quadraticCurveTo(-15,-5,-9,-4);g.closePath();g.fill();g.stroke();
    RR(g,-9+w*3,6,4,8,2,lg);RR(g,5-w*3,6,4,8,2,lg);

}

/* ---------- UI ---------- */
const COIN='<svg class="i" viewBox="0 0 16 16" style="width:12px;height:12px;vertical-align:-1px"><circle cx="8" cy="8" r="6.5" fill="#e3b558" stroke="#000"/></svg>';
const LOCK='<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.500" fill="#e8dcc0" stroke="#000" stroke-width="1.5"/><path d="M7.500 10V7a4.500 4.500 0 0 1 9 0v3" fill="none" stroke="#e8dcc0" stroke-width="2.500"/><circle cx="12" cy="15.5" r="1.800" fill="#000"/></svg>';
function thumb(L,w){const po=PORT;setOrient(false);const c=document.createElement('canvas');c.width=w;c.height=Math.round(w*VH/W);const g=c.getContext('2d');g.scale(w/W,w/W);g.translate(0,PADY);drawBg(g,L);drawFlag(g,prep(L).base[0],prep(L).base[1]-40,0,'#ef5a4e');setOrient(po);return c}
function buildMenu(theme){
  $('menu').style.setProperty('--accent',THEMES[theme].accent);
  $('themes').innerHTML='';
  for(const k of THEME_KEYS){const th=THEMES[k],b=document.createElement('button');b.className='theme'+(k===theme?' on':'');b.style.setProperty('--c',th.accent);
    const ls=LEVELS.filter(l=>l.theme===k),got=ls.reduce((a,l)=>a+(progress[l.id]||0),0);
    const tx=document.createElement('div');tx.className='tx';tx.innerHTML=`<b>${th.name}</b><span>${th.tag}</span>`;
    const em=document.createElement('em');em.textContent='★ '+got+'/'+ls.length*3;
    b.append(thumb(ls[ls.length-1],448),tx,em);b.onclick=()=>buildMenu(k);$('themes').appendChild(b)}
  $('levels').innerHTML='';
  LEVELS.forEach((L,i)=>{if(L.theme!==theme)return;
    const b=document.createElement('button');b.className='lv';b.disabled=!unlocked(i);
    const st=progress[L.id]||0,n=LEVELS.filter(l=>l.theme===theme).indexOf(L)+1;
    const no=document.createElement('div');no.className='no';no.textContent=n;
    const m=document.createElement('div');m.className='meta';
    m.innerHTML=`<div><b>${L.name}</b><small>${b.disabled?'通关上一关后解锁':L.waves+' 波'+(L.paths.length>1?' · 双路进攻':'')}</small></div><span class="stars">${'★'.repeat(st)}<s>${'★'.repeat(3-st)}</s></span>`;
    b.append(thumb(L,448),no,m);
    if(b.disabled){const lk=document.createElement('div');lk.className='lock';lk.innerHTML=LOCK;b.append(lk)}
    b.onclick=()=>openLevel(i);$('levels').appendChild(b)});
  try{localStorage.setItem('arcade-td-theme',theme)}catch(e){}
}
function openLevel(i){
  startLevel(i);$('menu').hidden=true;$('game').hidden=false;$('overlay').hidden=true;
  $('game').style.setProperty('--accent',S.th.accent);$('lvName').textContent=S.th.name+' · '+S.L.name;
  buildTowerBtns();resize();syncUI();
}
function backToMenu(){const th=S?S.L.theme:'forest';S=null;$('game').hidden=true;$('menu').hidden=false;buildMenu(th)}
function icon(c,type,lv){const g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);g.setTransform(1.25,0,0,1.25,0,0);drawTower(g,type,38,46,-.5,lv,0)}
function buildTowerBtns(){
  const box=$('towerBtns');box.innerHTML='';
  TOWER_KEYS.forEach((k,i)=>{const d=TOWERS[k],b=document.createElement('button');b.className='tw';b.dataset.k=k;
    const c=document.createElement('canvas');c.width=c.height=96;icon(c,k,1);
    const t=document.createElement('span');t.innerHTML=`<b>${d.name}</b><small>${COIN}${d.cost}</small><em>${d.desc}</em>`;
    const kb=document.createElement('kbd');kb.textContent=i+1;
    b.append(c,t,kb);b.onclick=()=>{audioInit();S.build=S.build===k?null:k;S.sel=null;S.cast=null;S.pend=S.hover=null;syncUI()};box.appendChild(b)});
}
function wavePreview(){
  if(S.wave>=S.L.waves)return'';const n={};for(const e of S.waves[S.wave])n[e.type]=(n[e.type]||0)+1;
  return'下一波：'+Object.keys(n).map(k=>`<span><canvas data-mob="${k}" width="56" height="56"></canvas>${S.th.mobs[k][0]} ×${n[k]}</span>`).join('');
}
function syncUI(){
  if(!S)return;S.dirty=false;
  $('hpV').textContent=S.lives;$('goldV').textContent=S.gold;$('waveV').textContent=S.wave+'/'+S.L.waves;$('waveBar').style.width=(S.wave/S.L.waves*100)+'%';
  $('speedBtn').textContent='×'+S.speed;$('pauseBtn').textContent=S.paused?'继续':'暂停';$('autoBtn').textContent='自动 '+(AUTO?'开':'关');$('sndBtn').textContent='音效 '+(AU.on?'开':'关');
  for(const b of $('towerBtns').children){b.classList.toggle('on',S.build===b.dataset.k);b.classList.toggle('poor',S.gold<TOWERS[b.dataset.k].cost)}
  const t=S.sel;$('selPanel').hidden=!t;if(t)$('selPanel').classList.toggle('top',t.y>H*.55);
  if(t){const d=TOWERS[t.type],c=upCost(t);$('selName').textContent=d.name+' Lv'+t.lv;$('modeBtn').textContent='目标：'+MODES[t.mode||0];icon($('selIcon'),t.type,t.lv);
    $('selStat').textContent=`伤害 ${Math.round(tDmg(t))} · 射程 ${(tRange(t)/T).toFixed(1)} · 间隔 ${d.rate}s`+(t.type==='archer'&&t.lv>=2?` · 暴击 ${t.lv>=3?25:15}%`:'');
    $('upBtn').innerHTML=c==null?'已满级':'升级 '+COIN+c;$('upBtn').disabled=c==null||S.gold<c;$('sellBtn').innerHTML='出售 '+COIN+Math.round(t.spent*SELL)}
  const wb=$('waveBtn');wb.disabled=S.active||!!S.over;
  wb.textContent=S.active?`第 ${S.wave} 波进行中…`:S.wave>=S.L.waves?'已完成':`开始第 ${S.wave+1} 波 ▶`;
  $('waveInfo').innerHTML=S.active?'':wavePreview();
  for(const c of $('waveInfo').querySelectorAll('canvas')){const k=c.dataset.mob,g=c.getContext('2d'),r=MOBS[k].r,z=Math.min(1.5,21/r);g.scale(z,z);
    drawMob(g,{type:k,x:28/z,y:(k==='boss'?34:30)/z,r,face:1,hit:0,slow:0,hp:1,max:1,ph:0},S.th.mobs[k],0)}
  if(S.over&&$('overlay').hidden){const win=S.over==='win';$('overlay').hidden=false;$('ovBox').className='box'+(win?'':' lose');
    $('ovTitle').textContent=win?'守住了！':'城堡失守';$('ovText').textContent=win?`剩余生命 ${S.lives}/${START_LIVES}`:`倒在第 ${S.wave} 波`;
    $('ovStars').innerHTML=win?'★'.repeat(S.stars)+'<s>'+'★'.repeat(3-S.stars)+'</s>':'';
    const nx=LEVELS[S.i+1];$('ovNext').hidden=!(win&&nx&&unlocked(S.i+1));}
}
function tileAt(ev){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*VH-PADY;return{c:Math.floor(x/T),r:Math.floor(y/T),x,y}}
// 鼠标：悬停即预览，点击放置。触屏：第一下只显示预览（塔和射程），再点同一格才放置；按住拖动可以挪预览。
let touching=false;
cv.addEventListener('pointermove',e=>{if(!S)return;if(e.pointerType==='mouse')S.hover=tileAt(e);else if(touching&&(S.build||S.cast)){S.hover=S.pend=tileAt(e)}});
cv.addEventListener('pointerleave',e=>{if(S&&e.pointerType==='mouse')S.hover=null});
addEventListener('pointerup',()=>{touching=false});addEventListener('pointercancel',()=>{touching=false});
cv.addEventListener('pointerdown',e=>{
  audioInit();if(!S||S.over)return;const h=tileAt(e),{c,r}=h,touch=e.pointerType!=='mouse';touching=touch;
  if(S.cast==='fire'){
    if(touch&&!(S.pend&&Math.hypot(S.pend.x-h.x,S.pend.y-h.y)<T*1.5)){S.pend=S.hover=h}
    else{const q=touch?S.pend:h;castFire(q.x,q.y);S.pend=null;S.hover=touch?null:h}
    syncUI();return}
  S.hover=h;
  const t=S.towers.find(t=>t.c===c&&t.r===r);
  if(t){S.sel=S.sel===t?null:t;S.build=null;S.pend=null}
  else if(S.build){
    if(touch&&!(S.pend&&S.pend.c===c&&S.pend.r===r))S.pend=h;
    else{S.pend=null;
      if(canBuild(c,r)){if(!place(S.build,c,r))S.fx.push({k:'text',x:(c+.5)*T,y:(r+.5)*T,txt:'金币不足',t:0,life:.8,col:'#ff8a80'})}
      else S.fx.push({k:'text',x:(c+.5)*T,y:(r+.5)*T,txt:'这里不能放',t:0,life:.8,col:'#ff8a80'})}}
  else S.sel=null;
  if(touch&&!S.pend)S.hover=null;
  syncUI();
});
$('waveBtn').onclick=()=>{audioInit();nextWave();syncUI()};
$('modeBtn').onclick=()=>{if(S.sel){S.sel.mode=((S.sel.mode||0)+1)%MODES.length;syncUI()}};
$('autoBtn').onclick=()=>{AUTO=!AUTO;syncUI()};
$('sndBtn').onclick=()=>{AU.on=!AU.on;try{localStorage.setItem('arcade-td-sound',AU.on?'1':'0')}catch(e){}if(AU.on)audioInit();syncUI()};
$('spFire').onclick=()=>{audioInit();if(S.spell.fire<=0){S.cast=S.cast==='fire'?null:'fire';S.build=null;S.sel=null;S.pend=S.hover=null;syncUI()}};
$('spIce').onclick=()=>{audioInit();castIce();syncUI()};
function syncSpells(){for(const[k,id,cd]of[['fire','spFire',FIRE_CD],['ice','spIce',ICE_CD]]){const b=$(id),p=Math.ceil(S.spell[k]/cd*100);if(b._p!==p){b._p=p;b.style.setProperty('--p',p);b.disabled=p>0}}$('spFire').classList.toggle('on',S.cast==='fire')}
$('upBtn').onclick=()=>{if(S.sel)upgrade(S.sel);syncUI()};
$('sellBtn').onclick=()=>{if(S.sel)sell(S.sel);syncUI()};
$('deselBtn').onclick=()=>{S.sel=null;syncUI()};
$('speedBtn').onclick=()=>{S.speed=S.speed%3+1;syncUI()};
$('pauseBtn').onclick=()=>{S.paused=!S.paused;syncUI()};
$('backBtn').onclick=backToMenu;$('ovMenu').onclick=backToMenu;
$('ovRetry').onclick=()=>openLevel(S.i);$('ovNext').onclick=()=>openLevel(S.i+1);
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe($('stage'));   // 底栏换行/选中面板出现时画布跟着缩放
addEventListener('keydown',e=>{
  if(!S)return;
  if(e.key>='1'&&e.key<='4'){const k=TOWER_KEYS[e.key-1];S.build=S.build===k?null:k;S.sel=null;S.cast=null}
  else if(e.key==='q'||e.key==='Q'){if(S.spell.fire<=0){S.cast=S.cast==='fire'?null:'fire';S.build=null}}
  else if(e.key==='w'||e.key==='W')castIce();
  else if(e.key===' '){e.preventDefault();nextWave()}
  else if(e.key==='Escape'){S.build=null;S.sel=null;S.cast=null;S.pend=null}
  else if(e.key==='p'||e.key==='P')S.paused=!S.paused;
  else return;
  syncUI();
});
let last=0;
function loop(ts){
  requestAnimationFrame(loop);if(!S)return;
  let dt=Math.min(.05,(ts-last)/1000||0)*S.speed;last=ts;
  while(dt>0){const h=Math.min(dt,1/30);step(h);dt-=h}
  if(S.dirty)syncUI();
  syncSpells();render();
}
let startTheme='forest';try{startTheme=localStorage.getItem('arcade-td-theme')||'forest'}catch(e){}
buildMenu(THEMES[startTheme]?startTheme:'forest');
requestAnimationFrame(loop);
window.TD={LEVELS,TOWERS,THEMES,MOBS,COLS:LC,ROWS:LR,T,PADY,flip,get PORT(){return PORT},castFire,castIce,prep,startLevel,place,upgrade,sell,nextWave,step,canBuild,upCost,render,drawBg,get S(){return S}};
</script>
</body>
</html>
