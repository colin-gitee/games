<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小游戏大厅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--ink:#0e0c12;--stone:#1d1a24;--line:#4a4356;--text:#efe6d0;--dim:#a79db3;--brass:#e3b558;
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:var(--text);
  background:var(--ink) radial-gradient(ellipse 90% 55% at 50% 0%,#33264a 0%,var(--ink) 70%) no-repeat;
  font:15px/1.6 'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  padding:calc(32px + env(safe-area-inset-top,0px)) 16px 56px}
main{max-width:1080px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,64px);margin:0;letter-spacing:.12em;line-height:1.1;
  background:linear-gradient(#ffe9a8,#d89a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000a)}
.sub{color:var(--dim);margin:8px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;background:var(--stone);border:2px solid #000a;border-radius:20px;overflow:hidden;color:inherit;text-decoration:none;
  box-shadow:0 8px 24px #0009;transition:transform .18s,box-shadow .18s,border-color .18s}
a.card:hover,a.card:focus-visible{transform:translateY(-6px);border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 18px 44px color-mix(in srgb,var(--c) 35%,#000);outline:none}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
.cover img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s}
a.card:hover .cover img{transform:scale(1.07)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,#1d1a24 100%);pointer-events:none}
.cover h2{position:absolute;left:18px;bottom:6px;z-index:1;margin:0;font-family:var(--display);font-weight:400;font-size:32px;letter-spacing:.1em;color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000}
.badge{position:absolute;top:12px;right:12px;z-index:1;font-size:12.5px;font-weight:700;color:#14110a;background:var(--c);border:2px solid #000a;border-radius:999px;padding:1px 12px;box-shadow:0 2px 0 #0008}
.body{padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body p{margin:0;color:var(--dim);font-size:13.5px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--dim);background:#0004}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.play{font-family:var(--display);font-size:19px;letter-spacing:.1em;color:#14110a;border:2px solid #000a;border-radius:999px;padding:3px 22px;
  background:linear-gradient(color-mix(in srgb,var(--c) 80%,#fff),var(--c));box-shadow:0 3px 0 #0009,inset 0 1px 0 #fff6;white-space:nowrap}
.card.soon{border-style:dashed;border-color:var(--line);box-shadow:none;background:#0003}
.card.soon .cover{background:repeating-linear-gradient(45deg,#1a1722 0 14px,#16131d 14px 28px);display:grid;place-items:center}
.card.soon .cover::after{display:none}
.card.soon .q{font-family:var(--display);font-size:84px;color:var(--line)}
.card.soon h2{position:static;margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.1em;color:var(--dim)}
footer{margin-top:40px;color:var(--dim);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>小游戏大厅</h1>
  <p class="sub">点开就玩，无需安装。进度保存在本机浏览器里。</p>
  <div class="grid" id="grid"></div>
  <footer>更多游戏制作中…</footer>
</main>

<script>
/* 新增游戏：在 GAMES 里加一项即可。
   path 游戏入口；cover 封面图（建议 16:10 的实机截图）；progress() 可选，返回一句进度文字 */
const GAMES=[
  {id:'mota',name:'魔塔 · 五界',path:'mota/index.html',cover:'mota/cover.jpg',color:'#e3b558',
   desc:'经典魔塔玩法：五个世界、每界 50 层，算好每一场战斗，从魔塔一路打到深海。',
   tags:['策略','RPG','单人'],
   progress(){const u=JSON.parse(localStorage.getItem('mota-unlocked')||'null');return u?`已解锁 ${u.length}/5 界`:''}},
  {id:'td',name:'守卫前线',path:'td/index.html',cover:'td/cover.jpg',color:'#7fd060',
   desc:'塔防：在森林、沙漠、地底三片战场布置守卫，拦下沿路而来的怪物。共 12 关。',
   tags:['塔防','多关卡','单人'],
   progress(){const p=JSON.parse(localStorage.getItem('arcade-td-progress')||'{}');const n=Object.values(p).reduce((a,b)=>a+b,0);return n?`★ ${n}/36`:''}},
];

const grid=document.getElementById('grid');
for(const g of GAMES){
  let prog='';try{prog=g.progress?g.progress():''}catch(e){}
  const a=document.createElement('a');a.className='card';a.href=g.path;a.style.setProperty('--c',g.color);
  a.innerHTML=`<div class="cover"><img src="${g.cover}" alt="${g.name} 游戏画面" loading="lazy"><h2>${g.name}</h2>${prog?`<span class="badge">${prog}</span>`:''}</div>
    <div class="body"><p>${g.desc}</p>
    <div class="foot"><div class="tags">${g.tags.map(t=>`<span>${t}</span>`).join('')}</div><span class="play">开始 ▶</span></div></div>`;
  grid.appendChild(a);
}
grid.insertAdjacentHTML('beforeend',`<div class="card soon"><div class="cover"><span class="q">?</span></div>
  <div class="body"><h2>敬请期待</h2><p>下一款小游戏正在路上。</p></div></div>`);
</script>
<script src="update.js"></script>
</body>
</html>
