<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>怪物泡泡 · 合成</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--ink:#0e0c12;--stone:#1d1a24;--line:#4a4356;--text:#efe6d0;--dim:#a79db3;--brass:#e3b558;--accent:#7cc8f0;
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{margin:0;color:var(--text);font:14px/1.5 'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--ink) radial-gradient(ellipse 90% 55% at 50% 0%,#23344a 0%,var(--ink) 72%) no-repeat;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(#35303f,#262230);border-radius:10px;padding:6px 12px;box-shadow:0 2px 0 #0008,inset 0 1px 0 #ffffff14}
button:active{transform:translateY(2px);box-shadow:none}
a{color:var(--dim);text-decoration:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;white-space:nowrap;background:#0006;box-shadow:none;display:inline-block}
.primary{background:linear-gradient(#a6dcf8,var(--accent));border-color:#000a;color:#10161c;font-weight:700}
#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.hud h1{margin:0 auto 0 0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.08em;color:var(--accent);text-shadow:0 2px 0 #000;white-space:nowrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;background:linear-gradient(#2c2836,#1c1924);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}
.chip small{color:var(--dim);font-size:11.5px}.chip b{font-size:16px;font-variant-numeric:tabular-nums}
#scoreV{color:var(--brass)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
canvas#cv{display:block;border-radius:16px;border:3px solid #000;outline:2px solid #3c5a72;touch-action:none;cursor:pointer;box-shadow:0 12px 40px #000c}
.chain{display:flex;justify-content:center;gap:2px;padding:8px 6px 10px;flex-wrap:nowrap;overflow:hidden}
.chain canvas{width:27px;height:27px;opacity:.3;transition:opacity .3s,transform .3s;flex:none}
.chain canvas.on{opacity:1}.chain canvas.top{transform:scale(1.25)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,.72);z-index:5;backdrop-filter:blur(3px)}
#overlay .box{background:linear-gradient(#2c2836,#1a1722);border:2px solid var(--brass);border-radius:18px;padding:20px 28px 22px;text-align:center;min-width:240px;box-shadow:0 20px 60px #000}
#overlay h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.1em;color:var(--brass);text-shadow:0 3px 0 #000}
#overlay p{margin:4px 0 14px;color:var(--dim)}#overlay p b{color:var(--text);font-size:18px}
@media (orientation:landscape) and (max-height:560px){
  #app{flex-direction:row;max-width:none;align-items:stretch}
  .hud{flex-direction:column;align-items:stretch;width:132px;flex-wrap:nowrap}.hud h1{margin:0;font-size:18px;white-space:normal}
  .chip{justify-content:space-between}
  .chain{flex-direction:column;flex-wrap:wrap;width:74px;align-content:center;padding:6px}
  .stage{padding:6px 0}
}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <a class="pill" href="../index.html">‹ 大厅</a>
    <h1>怪物泡泡</h1>
    <span class="chip"><small>分数</small><b id="scoreV">0</b></span>
    <span class="chip"><small>最高</small><b id="bestV">0</b></span>
    <button class="pill" id="sndBtn">音效 开</button>
    <button class="pill" id="newBtn">重开</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay" hidden><div class="box">
      <h2 id="ovTitle">泡泡溢出了</h2><p id="ovText"></p>
      <button class="primary" id="ovRetry">再来一局</button>
    </div></div>
  </div>
  <div class="chain" id="chain"></div>
</div>

<script src="../shared/monsters.js"></script>
<script>
'use strict';
/* =====================================================================
   怪物泡泡 — 掉落合成。两个相同的泡泡碰到一起合成更大的一级，一共 11 级。
   泡泡堆过顶上的红线并停住就结束。结构：数据 → 物理 step(dt) → 渲染 → 输入/存档。
   ===================================================================== */
const $=id=>document.getElementById(id);
const W=360,H=560,LINE=92,TOP=46;     // 逻辑尺寸；LINE 是溢出线，TOP 是待投放泡泡的高度
// 每一级：怪物、颜色、半径、合成得分
const TIERS=[
  ['bee','#f0c838',15,1],['slime','#7bd65a',21,3],['bat','#9468dc',27,6],['scarab','#4a7fc8',34,10],['spider','#c04866',42,15],
  ['wolf','#a9b1ba',51,21],['skel','#e2dccb',61,28],['mummy','#ddd6ba',72,36],['treant','#9a6c3c',84,45],['troll','#4c9f78',97,55],['lava','#e8602e',112,66],
].map(([id,col,r,pts])=>({id,col,r,pts}));
const DROP_W=[36,30,20,10,4];        // 待投放泡泡只出前 5 级，按这个权重随机
const G=1500,SUB=4,ITER=3;

/* ---------- 音效 ---------- */
const AU={ctx:null,on:true};try{AU.on=localStorage.getItem('arcade-merge-sound')!=='0'}catch(e){}
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}if(!AU.on)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{AU.ctx=new C();AU.out=AU.ctx.createGain();AU.out.gain.value=.4;AU.out.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
function tone(type,f0,f1,dur,vol,delay){if(!AU.on||!AU.ctx)return;const c=AU.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.02)}

/* ---------- 状态 ---------- */
let S=null,best=0;try{best=+localStorage.getItem('arcade-merge-best')||0}catch(e){}
const SAVE='arcade-merge-run';
const pickTier=()=>{let x=Math.random()*100;for(let i=0;i<DROP_W.length;i++){if((x-=DROP_W[i])<0)return i}return 0};
function newGame(){
  S={b:[],fx:[],score:0,cur:pickTier(),next:pickTier(),aim:W/2,cool:0,over:false,idc:1,top:0,time:0,warn:0,dirty:true};
  $('overlay').hidden=true;save();
}
function save(){if(!S)return;try{if(S.over){localStorage.removeItem(SAVE);return}
  localStorage.setItem(SAVE,JSON.stringify({v:1,score:S.score,cur:S.cur,next:S.next,top:S.top,b:S.b.map(o=>[Math.round(o.x*10)/10,Math.round(o.y*10)/10,o.t,Math.round(o.a*100)/100])}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(!d||d.v!==1||!Array.isArray(d.b))return false;
  newGame();S.score=+d.score||0;S.cur=TIERS[d.cur]?d.cur:0;S.next=TIERS[d.next]?d.next:0;S.top=d.top|0;
  for(const q of d.b)if(TIERS[q[2]])S.b.push({id:S.idc++,x:+q[0],y:+q[1],vx:0,vy:0,t:q[2],r:TIERS[q[2]].r,a:+q[3]||0,av:0,age:9,ot:0,pop:0});
  return true}catch(e){return false}}
function drop(){
  if(!S||S.over||S.cool>0)return;const T=TIERS[S.cur];
  S.b.push({id:S.idc++,x:Math.max(T.r+2,Math.min(W-T.r-2,S.aim)),y:TOP,vx:0,vy:60,t:S.cur,r:T.r,a:0,av:0,age:0,ot:0,pop:0});
  S.cur=S.next;S.next=pickTier();S.cool=.5;S.dirty=true;tone('sine',420,260,.08,.25);
}
function merge(a,b){
  const t=a.t+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;a.dead=b.dead=true;S.score+=TIERS[a.t].pts*2;S.dirty=true;
  for(let i=0;i<10;i++){const an=Math.random()*6.283,v=60+Math.random()*120;S.fx.push({k:'p',x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,r:2+Math.random()*4,t:0,life:.35+Math.random()*.3,col:TIERS[a.t].col})}
  S.fx.push({k:'ring',x,y,r:TIERS[Math.min(10,t)].r*1.3,t:0,life:.35},{k:'txt',x,y:y-10,txt:'+'+TIERS[a.t].pts*2,t:0,life:.8});
  tone('triangle',260+a.t*55,520+a.t*70,.14,.3);tone('sine',520+a.t*70,780+a.t*80,.12,.18,.06);
  if(t>10){S.score+=200;S.fx.push({k:'txt',x,y:y-40,txt:'魔王对消 +200',t:0,life:1.4,big:true});return}   // 两个最大的碰到一起直接消掉
  S.b.push({id:S.idc++,x,y,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2-40,t,r:TIERS[t].r,a:(a.a+b.a)/2,av:0,age:.3,ot:0,pop:.25});
  if(t>S.top){S.top=t;if(t>=5)S.fx.push({k:'txt',x:W/2,y:H/2,txt:Monsters.LIST.find(m=>m[0]===TIERS[t].id)[1]+'！',t:0,life:1.3,big:true})}
}
function step(dt){
  if(!S||S.over)return;S.time+=dt;if(S.cool>0)S.cool-=dt;
  const h=dt/SUB;
  for(let s=0;s<SUB;s++){
    for(const o of S.b){o.vy+=G*h;o.x+=o.vx*h;o.y+=o.vy*h;o.a+=o.av*h}
    for(let it=0;it<ITER;it++){
      const B=S.b;
      for(let i=0;i<B.length;i++){const a=B[i];if(a.dead)continue;
        for(let j=i+1;j<B.length;j++){const b=B[j];if(b.dead)continue;
          const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)continue;
          if(a.t===b.t&&a.age>.05&&b.age>.05){merge(a,b);break}
          const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,ov=rr-d,ma=a.r*a.r,mb=b.r*b.r,ka=mb/(ma+mb),kb=ma/(ma+mb);
          a.x-=nx*ov*ka;a.y-=ny*ov*ka;b.x+=nx*ov*kb;b.y+=ny*ov*kb;
          const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
          if(vn<0){const jn=-(1.12)*vn;a.vx-=jn*ka*nx;a.vy-=jn*ka*ny;b.vx+=jn*kb*nx;b.vy+=jn*kb*ny;
            const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty,jt=vt*.18;a.vx+=jt*ka*tx;a.vy+=jt*ka*ty;b.vx-=jt*kb*tx;b.vy-=jt*kb*ty;a.av+=vt*.004;b.av+=vt*.004}
        }}
      for(const o of B){if(o.dead)continue;
        if(o.x<o.r){o.x=o.r;if(o.vx<0)o.vx*=-.2}else if(o.x>W-o.r){o.x=W-o.r;if(o.vx>0)o.vx*=-.2}
        if(o.y>H-o.r){o.y=H-o.r;if(o.vy>0)o.vy*=-.15;o.vx*=.94;o.av=o.av*.9+o.vx/o.r*.1}}
      if(B.some(o=>o.dead))S.b=B.filter(o=>!o.dead);
    }
    for(const o of S.b){o.vx*=o.vx*o.vx+o.vy*o.vy<900?.9:.995;o.vy*=.999;o.av*=.95}   // 慢下来的泡泡多加一点阻尼，免得堆里一直抖
  }
  let warn=0;
  for(const o of S.b){o.age+=dt;if(o.pop>0)o.pop-=dt;
    if(o.age>1&&o.y-o.r<LINE&&Math.hypot(o.vx,o.vy)<60){o.ot+=dt;warn=Math.max(warn,o.ot)}else o.ot=0}
  S.warn=warn;
  if(warn>2){S.over=true;S.dirty=true;if(S.score>best){best=S.score;S.record=true;try{localStorage.setItem('arcade-merge-best',best)}catch(e){}}
    tone('sawtooth',300,90,.5,.25);save()}
  for(const f of S.fx){f.t+=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt}}
  S.fx=S.fx.filter(f=>f.t<f.life);
}

/* ---------- 绘制 ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let K=1;
const bubCache={};
// 一个泡泡：半透明球 + 里面的怪物。按级别预渲染成贴图
function bubble(t){
  if(bubCache[t])return bubCache[t];const T=TIERS[t],r=T.r,SS=2,c=document.createElement('canvas'),P=r+4;c.width=c.height=P*2*SS;c.P=P;
  const g=c.getContext('2d');g.setTransform(SS,0,0,SS,P*SS,P*SS);
  let gr=g.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);gr.addColorStop(0,Monsters.lite(T.col,.75));gr.addColorStop(.55,Monsters.lite(T.col,.25));gr.addColorStop(1,Monsters.dark(T.col,.25));
  g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
  g.strokeStyle=Monsters.OL;g.lineWidth=2.5;g.stroke();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;g.beginPath();g.arc(0,0,r-3.5,0,7);g.stroke();
  const mr=r*.5,sp=Monsters.sprite(T.id,T.col,3,Math.max(7,mr));g.drawImage(sp,-sp.R,-sp.R+r*.06,sp.R*2,sp.R*2);
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-r*.42,-r*.52,r*.26,r*.13,-.6,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.arc(r*.5,r*.55,r*.07,0,7);g.fill();
  return bubCache[t]=c;
}
function drawBub(g,t,x,y,a,sc){const c=bubble(t),P=c.P*(sc||1);g.save();g.translate(x,y);g.rotate(a);g.drawImage(c,-P,-P,P*2,P*2);g.restore()}
function resize(){
  const st=$('stage'),aw=st.clientWidth-16,ah=st.clientHeight-10,cw=Math.max(140,Math.min(aw,ah*W/H)),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=cw+'px';cv.style.height=cw*H/W+'px';K=Math.min(2.5,cw*dpr/W);cv.width=Math.round(W*K);cv.height=Math.round(H*K);
}
function render(){
  if(!S)return;const g=ctx,tm=S.time;g.setTransform(K,0,0,K,0,0);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b2a3c');bg.addColorStop(1,'#101822');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.025)';for(let i=0;i<14;i++){g.beginPath();g.arc((i*97)%W,(i*163+tm*8)%H,18+(i*7)%22,0,7);g.fill()}
  // 溢出线
  const wa=S.warn>.3?.5+.5*Math.sin(tm*14):0;g.strokeStyle=wa?'rgba(255,90,78,'+(.5+.5*wa)+')':'rgba(255,255,255,.22)';g.lineWidth=wa?3:2;g.setLineDash([10,8]);g.beginPath();g.moveTo(0,LINE);g.lineTo(W,LINE);g.stroke();g.setLineDash([]);
  if(wa){g.fillStyle='rgba(255,90,78,'+.12*wa+')';g.fillRect(0,0,W,LINE)}
  // 待投放
  if(!S.over){const T=TIERS[S.cur],x=Math.max(T.r+2,Math.min(W-T.r-2,S.aim));
    g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;g.setLineDash([4,8]);g.beginPath();g.moveTo(x,TOP+T.r);g.lineTo(x,H);g.stroke();g.setLineDash([]);
    if(S.cool<=0)drawBub(g,S.cur,x,TOP,0);else{g.globalAlpha=.35;drawBub(g,S.cur,x,TOP,0,.7);g.globalAlpha=1}
    g.fillStyle='rgba(239,230,208,.7)';g.font='700 11px system-ui,sans-serif';g.textAlign='right';g.textBaseline='middle';g.fillText('下一个',W-44,20);drawBub(g,S.next,W-22,20,0,Math.min(1,16/TIERS[S.next].r))}
  for(const o of S.b)drawBub(g,o.t,o.x,o.y,o.a,o.pop>0?1+Math.sin(o.pop*12.5)*.12:1);
  for(const f of S.fx){const k=f.t/f.life;g.globalAlpha=Math.max(0,1-k);
    if(f.k==='p'){g.fillStyle=f.col;g.beginPath();g.arc(f.x,f.y,f.r*(1-k*.5),0,7);g.fill()}
    else if(f.k==='ring'){g.strokeStyle='#fff';g.lineWidth=4*(1-k)+1;g.beginPath();g.arc(f.x,f.y,f.r*(.4+.7*k),0,7);g.stroke()}
    else{g.font=f.big?"400 34px 'ZCOOL QingKe HuangYou',system-ui,sans-serif":'700 17px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=f.big?6:4;g.strokeStyle=Monsters.OL;
      const y=f.y-k*26;g.strokeText(f.txt,f.x,y);g.fillStyle=f.big?'#ffd76a':'#fff';g.fillText(f.txt,f.x,y)}
    g.globalAlpha=1}
}
function syncUI(){
  S.dirty=false;$('scoreV').textContent=S.score;$('bestV').textContent=Math.max(best,S.score);$('sndBtn').textContent='音效 '+(AU.on?'开':'关');
  [...$('chain').children].forEach((c,i)=>{c.classList.toggle('on',i<=S.top);c.classList.toggle('top',i===S.top)});
  if(S.over&&$('overlay').hidden){$('overlay').hidden=false;$('ovText').innerHTML=`本局 <b>${S.score}</b> 分`+(S.record?' · 新纪录！':` · 最高 ${best}`)}
}
TIERS.forEach((T,i)=>{const c=document.createElement('canvas');c.width=c.height=54;const g=c.getContext('2d'),b=bubble(i),s=24/b.P;g.translate(27,27);g.scale(s,s);g.drawImage(b,-b.P,-b.P,b.P*2,b.P*2);c.title=Monsters.LIST.find(m=>m[0]===T.id)[1];$('chain').appendChild(c)});

/* ---------- 输入 ---------- */
const aimAt=e=>{const r=cv.getBoundingClientRect();S.aim=(e.clientX-r.left)/r.width*W};
let down=false;
cv.addEventListener('pointerdown',e=>{audioInit();if(!S||S.over)return;down=true;aimAt(e)});
cv.addEventListener('pointermove',e=>{if(S&&!S.over&&(down||e.pointerType==='mouse'))aimAt(e)});
addEventListener('pointerup',e=>{if(down){down=false;drop()}});
addEventListener('pointercancel',()=>{down=false});
addEventListener('keydown',e=>{if(!S||S.over)return;if(e.key==='ArrowLeft')S.aim=Math.max(0,S.aim-14);else if(e.key==='ArrowRight')S.aim=Math.min(W,S.aim+14);else if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();audioInit();drop()}});
$('newBtn').onclick=()=>{if(!S.b.length||S.over||confirm('放弃这一局，重新开始？'))newGame()};
$('ovRetry').onclick=newGame;
$('sndBtn').onclick=()=>{AU.on=!AU.on;try{localStorage.setItem('arcade-merge-sound',AU.on?'1':'0')}catch(e){}if(AU.on)audioInit();syncUI()};
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));
setInterval(save,1500);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
let last=0;
function loop(ts){requestAnimationFrame(loop);let dt=Math.min(.033,(ts-last)/1000||0);last=ts;step(dt);if(S.dirty)syncUI();render()}
try{localStorage.setItem('arcade-last','merge')}catch(e){}
if(!load())newGame();
resize();syncUI();requestAnimationFrame(loop);
window.__busy=()=>!!(S&&!S.over&&S.b.length);
window.MG={get S(){return S},step,drop,newGame,save,load,render,TIERS};
</script>
<script src="../update.js"></script>
</body>
</html>
