<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>尖塔牌局 · 卡牌爬塔</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--ink:#0e0c12;--stone:#1d1a24;--stone-2:#2a2633;--line:#4a4356;--text:#efe6d0;--dim:#a79db3;--brass:#e3b558;--blood:#ef6a5e;--atk:#d8574a;--skl:#4a90d8;--pow:#d8a030;
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{margin:0;color:var(--text);font:14px/1.45 'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--ink) radial-gradient(ellipse 90% 55% at 50% 0%,#3a2440 0%,var(--ink) 72%) no-repeat;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(#35303f,#262230);border-radius:10px;padding:7px 14px;box-shadow:0 2px 0 #0008,inset 0 1px 0 #ffffff14}
button:not(:disabled):active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--dim);text-decoration:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;background:#0006;box-shadow:none;display:inline-block}
.primary{background:linear-gradient(#f2cf7e,var(--brass));border-color:#000a;color:#17120a;font-weight:700}
#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;flex-wrap:wrap}
.chip{background:linear-gradient(#2c2836,#1c1924);border:1px solid var(--line);border-radius:999px;padding:2px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-size:15px}.chip.hp b{color:#ff8a7e}.chip.gold b{color:var(--brass)}
.relics{display:flex;gap:4px;padding:0 10px 4px;flex-wrap:wrap;min-height:26px}
.relic{font-size:12px;border:1px solid var(--brass);color:var(--brass);border-radius:6px;padding:0 6px;background:#0005;cursor:pointer}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
h2{font-family:var(--display);font-weight:400;letter-spacing:.1em;color:var(--brass);margin:0;text-shadow:0 2px 0 #000}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;overflow:auto}
.center h2{font-size:30px}.center p{margin:0;color:var(--dim);max-width:520px}
.nodes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.node{width:132px;padding:14px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.node b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.08em}.node small{color:var(--dim);font-size:12px}
.node.fight b{color:#ff8a7e}.node.elite b{color:#ff5a4a}.node.rest b{color:#7be05c}.node.shop b{color:var(--brass)}.node.event b{color:#b48cff}.node.boss b{color:#ff5a4a;font-size:26px}.node.chest b{color:var(--brass)}
.tower{display:flex;gap:3px;align-items:center}.tower i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}.tower i.done{background:var(--brass)}.tower i.cur{outline:2px solid #fff}.tower i.b{width:16px;height:16px;background:#7a2a24}
/* 战斗 */
.foes{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:6px 8px 2px}
.foe{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:12px;border:2px solid transparent;min-width:84px;cursor:pointer;transition:transform .15s}
.foe.dead{opacity:.25;pointer-events:none;filter:grayscale(1)}
.foe.pick{border-color:var(--brass);background:#e3b55818}
.foe canvas{display:block}
.foe .nm{font-size:12px;color:var(--dim)}
.intent{font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:#000a;border:1px solid var(--line);white-space:nowrap;min-height:22px}
.intent .a{color:#ff8a7e}.intent .b{color:#8fc4ff}.intent .s{color:var(--brass)}.intent .d{color:#c9a0ff}
.bar{position:relative;width:100%;min-width:76px;height:14px;border-radius:7px;background:#000a;border:1px solid #000;overflow:hidden;font-size:10.5px;line-height:12px;text-align:center;font-weight:700}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ef6a5e,#b83a30);transition:width .25s}.bar span{position:relative;text-shadow:0 1px 1px #000}
.bar.blk{border-color:#8fc4ff;box-shadow:0 0 0 1px #8fc4ff}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:18px}
.st{font-size:11px;border-radius:5px;padding:0 5px;background:#000a;border:1px solid var(--line);white-space:nowrap}
.st.blk{color:#8fc4ff;border-color:#8fc4ff}.st.vuln{color:#ff9a6a}.st.weak{color:#c9a0ff}.st.str{color:var(--brass)}.st.poison{color:#8fe06a}.st.pw{color:#ffd76a}
.me{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0004}
.me .who{flex:1;min-width:0}.me .bar{height:16px;line-height:14px;font-size:11.5px}
.orb{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#17120a;background:radial-gradient(circle at 35% 30%,#fff2b0,#e3a030);border:2px solid #000;box-shadow:0 0 14px #e3a03088}
.orb.zero{background:radial-gradient(circle at 35% 30%,#777,#444);box-shadow:none;color:#ccc}
.piles{display:flex;flex-direction:column;gap:3px}.piles button{padding:2px 9px;font-size:12px;border-radius:8px}
#endBtn{padding:10px 14px;font-family:var(--display);font-size:18px;letter-spacing:.08em}
.hand{height:158px;display:flex;justify-content:center;align-items:flex-end;padding:0 8px 10px;position:relative}
.card{position:relative;width:96px;height:134px;flex:none;border-radius:10px;border:2px solid #000;padding:5px 5px 4px;display:flex;flex-direction:column;gap:2px;text-align:center;cursor:pointer;
  background:linear-gradient(#3a3444,#221e2a);box-shadow:0 4px 10px #000a;transition:transform .12s,margin .12s;--tc:var(--atk)}
.card.S{--tc:var(--skl)}.card.P{--tc:var(--pow)}
.card::before{content:'';position:absolute;inset:0;border-radius:8px;border:2px solid var(--tc);pointer-events:none;opacity:.9}
.card .cost{position:absolute;left:-7px;top:-7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#17120a;background:radial-gradient(circle at 35% 30%,#fff2b0,#e3a030);border:2px solid #000;z-index:1}
.card .nm{font-family:var(--display);font-size:15.5px;letter-spacing:.04em;line-height:1.15;padding:0 12px;min-height:19px}.card.up .nm{color:#8fe06a}
.card .art{height:34px;border-radius:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 60%,#000),color-mix(in srgb,var(--tc) 25%,#000));display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff9;border:1px solid #000}
.card .ds{font-size:11px;line-height:1.3;color:#e8e0d0;flex:1;display:flex;align-items:center;justify-content:center}
.card .ty{font-size:9.5px;color:var(--tc);letter-spacing:.1em}
.hand .card.sel{transform:translateY(-34px) scale(1.18);z-index:5;box-shadow:0 0 0 2px var(--brass),0 10px 24px #000}
.hand .card.no{filter:brightness(.55)}
.hint{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:12.5px;color:var(--brass);pointer-events:none;text-shadow:0 1px 2px #000}
.float{position:fixed;z-index:20;pointer-events:none;font-weight:700;font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:fl .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes fl{to{transform:translate(-50%,-190%);opacity:0}}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lunge{animation:lg .3s}@keyframes lg{50%{transform:translateY(22px) scale(1.08)}}
/* 弹层 */
.ov{position:absolute;inset:0;z-index:10;background:rgba(8,6,12,.9);display:flex;flex-direction:column;padding:12px;gap:8px}
.ov .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}.ov .hd h2{font-size:22px}.ov .hd small{color:var(--dim)}
.grid{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;align-content:flex-start;padding:10px 4px}
.grid .card:hover{transform:translateY(-3px)}
.pick3{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.pick3 .card{width:112px;height:156px}.pick3 .card .ds{font-size:12px}.pick3 .card .art{height:42px}
.shop{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.item{display:flex;flex-direction:column;align-items:center;gap:5px}.item .price{font-weight:700;color:var(--brass)}.item.sold{opacity:.3;pointer-events:none}
.rel{width:132px;padding:10px 8px;border-radius:12px;border:1px solid var(--brass);background:#0005;text-align:center}.rel b{color:var(--brass);display:block}.rel small{color:var(--dim);font-size:12px}
#toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:30;background:#000d;border:1px solid var(--brass);border-radius:12px;padding:6px 14px;max-width:88%;text-align:center;pointer-events:none}
@media (max-width:520px){.card{width:88px;height:126px}.card .ds{font-size:10.5px}.hand{height:150px}.foe{min-width:72px;padding:3px}.node{width:108px}}
@media (orientation:landscape) and (max-height:520px){.hand{height:128px;padding-bottom:4px}.card{width:84px;height:116px}.card .art{height:22px;font-size:15px}.me{padding:3px 10px}.orb{width:38px;height:38px;font-size:18px}.top{padding:4px 10px 2px}.relics{min-height:0}.foe .nm{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="pill" href="../index.html">‹ 大厅</a>
    <span class="chip hp">♥ <b id="hpV"></b></span>
    <span class="chip gold">● <b id="goldV"></b></span>
    <span class="chip">第 <b id="flV"></b> 层</span>
    <span style="flex:1"></span>
    <button class="pill" id="deckBtn">牌组</button>
    <button class="pill" id="menuBtn">放弃</button>
  </div>
  <div class="relics" id="relics"></div>
  <div id="main"></div>
  <div id="toast" hidden></div>
</div>

<script src="../shared/monsters.js"></script>
<script>
'use strict';
/* =====================================================================
   尖塔牌局 — 卡牌爬塔（15 层）。结构：数据(卡牌/敌人/遗物) → 规则(纯函数，改的是 R 这一个存档对象) → 界面。
   整局状态都在 R 里，每次操作后存进 localStorage，退出再打开原样恢复。
   加卡：CARDS 里加一项；加敌人：EN 里加一项并放进 GROUPS。
   ===================================================================== */
const $=id=>document.getElementById(id);
const M=Monsters,COL=Object.fromEntries(M.LIST.map(m=>[m[0],m[2]])),NAME=Object.fromEntries(M.LIST.map(m=>[m[0],m[1]]));
const FLOORS=15;
// 卡牌：t 类型(A 攻击 / S 技能 / P 能力)，c 费用，u 升级后覆盖的数值
const CARDS={
  strike:{n:'打击',t:'A',c:1,dmg:6,u:{dmg:9},basic:1},
  defend:{n:'防御',t:'S',c:1,block:5,u:{block:8},basic:1},
  bash:{n:'重击',t:'A',c:2,dmg:8,vuln:2,u:{dmg:10,vuln:3},basic:1},
  cleave:{n:'顺劈',t:'A',c:1,dmg:8,all:1,u:{dmg:11}},
  twin:{n:'连斩',t:'A',c:1,dmg:5,times:2,u:{dmg:7}},
  wave:{n:'盾击',t:'A',c:1,dmg:5,block:5,u:{dmg:7,block:7}},
  smash:{n:'痛击',t:'A',c:2,dmg:12,weak:2,u:{dmg:14,weak:3}},
  whirl:{n:'旋风斩',t:'A',c:2,dmg:14,all:1,u:{dmg:18}},
  venom:{n:'毒刃',t:'A',c:1,dmg:4,poison:4,u:{dmg:5,poison:6}},
  leech:{n:'吸血斩',t:'A',c:2,dmg:10,heal:3,u:{dmg:13,heal:4}},
  quick:{n:'快刀',t:'A',c:0,dmg:4,draw:1,u:{dmg:6}},
  reck:{n:'背水一击',t:'A',c:1,dmg:14,selfdmg:3,u:{dmg:18}},
  finish:{n:'终结',t:'A',c:3,dmg:30,u:{dmg:40}},
  flurry:{n:'乱舞',t:'A',c:2,dmg:4,times:4,u:{dmg:5}},
  wall:{n:'铁壁',t:'S',c:2,block:14,u:{block:18}},
  dodge:{n:'闪避',t:'S',c:1,block:7,draw:1,u:{block:9}},
  shout:{n:'战吼',t:'S',c:0,draw:2,exhaust:1,u:{draw:3}},
  toxin:{n:'淬毒',t:'S',c:1,poison:6,u:{poison:8}},
  plague:{n:'瘟疫',t:'S',c:2,poison:5,all:1,u:{poison:7}},
  scare:{n:'恐吓',t:'S',c:0,weak:1,all:1,exhaust:1,u:{weak:2}},
  expose:{n:'破绽',t:'S',c:1,vuln:2,draw:1,u:{vuln:3}},
  focus:{n:'冥想',t:'S',c:1,energy:2,exhaust:1,u:{c:0}},
  bandage:{n:'包扎',t:'S',c:1,heal:5,exhaust:1,u:{heal:8}},
  guard:{n:'架势',t:'S',c:1,block:4,str:1,u:{block:6}},
  awaken:{n:'觉醒',t:'P',c:1,str:2,u:{str:3}},
  plate:{n:'金刚',t:'P',c:2,pw:['plate',4],u:{pw:['plate',6]}},
  miasma:{n:'毒雾',t:'P',c:1,pw:['miasma',2],u:{pw:['miasma',3]}},
  fervor:{n:'狂热',t:'P',c:2,pw:['fervor',1],u:{c:1}},
  thorns:{n:'荆棘',t:'P',c:1,pw:['thorns',3],u:{pw:['thorns',5]}},
};
const PW={plate:v=>`每回合开始获得 ${v} 点格挡`,miasma:v=>`每回合开始给全体敌人 ${v} 层中毒`,fervor:v=>`每回合多抽 ${v} 张牌`,thorns:v=>`被攻击时反弹 ${v} 点伤害`};
const PWN={plate:'金刚',miasma:'毒雾',fervor:'狂热',thorns:'荆棘'};
const cdef=c=>{const b=CARDS[c.id];return c.up?Object.assign({},b,b.u,{up:1}):b};
function ctext(d){const p=[],T=d.all?'全体敌人':'';
  if(d.selfdmg)p.push(`失去 ${d.selfdmg} 点生命`);
  if(d.dmg)p.push(`${d.all?'对全体':''}造成 ${d.dmg} 点伤害`+(d.times>1?` ×${d.times}`:''));
  if(d.block)p.push(`获得 ${d.block} 点格挡`);
  if(d.vuln)p.push(`给予${T} ${d.vuln} 层易伤`);if(d.weak)p.push(`给予${T} ${d.weak} 层虚弱`);if(d.poison)p.push(`给予${T} ${d.poison} 层中毒`);
  if(d.str)p.push(`获得 ${d.str} 点力量`);if(d.heal)p.push(`回复 ${d.heal} 点生命`);if(d.draw)p.push(`抽 ${d.draw} 张牌`);if(d.energy)p.push(`获得 ${d.energy} 点能量`);
  if(d.pw)p.push(PW[d.pw[0]](d.pw[1]));if(d.exhaust)p.push('消耗');return p.join('。')+'。'}
const needT=d=>!d.all&&!!(d.dmg||d.vuln||d.weak||d.poison);
// 敌人：mv 行动表（a 攻击 t 次数 b 格挡 s 力量 w 虚弱 v 易伤），ai: cycle 按顺序 / rand 随机
const EN={
  slime:{hp:[18,22],mv:[{a:5},{a:3,w:1}],ai:'rand'},bee:{hp:[9,11],mv:[{a:3,t:2},{a:5}],ai:'rand'},bat:{hp:[15,18],mv:[{a:6},{a:3,b:5}],ai:'cycle'},
  wolf:{hp:[24,28],mv:[{s:2},{a:7},{a:7}],ai:'cycle'},skel:{hp:[32,36],mv:[{a:8},{b:8,a:4},{a:4,t:2}],ai:'cycle'},spider:{hp:[24,28],mv:[{a:5,v:1},{a:6}],ai:'rand'},
  scarab:{hp:[26,30],mv:[{b:9},{a:7},{a:4,b:5}],ai:'cycle'},scorpion:{hp:[36,42],mv:[{a:9},{a:5,w:2},{a:10}],ai:'cycle'},worm:{hp:[40,46],mv:[{a:10},{s:2,b:6},{a:6,t:2}],ai:'cycle'},
  mummy:{hp:[50,56],mv:[{v:2,a:5},{a:12},{a:7,t:2}],ai:'cycle'},garg:{hp:[58,66],mv:[{b:12},{a:14},{a:8,t:2}],ai:'cycle'},treant:{hp:[64,72],mv:[{a:9},{s:2},{a:11},{b:10,a:5}],ai:'cycle'},
  troll:{hp:[74,82],mv:[{a:12},{s:2},{a:7,t:2},{a:15}],ai:'cycle',big:1},pharaoh:{hp:[90,98],mv:[{w:2,v:1},{a:14},{a:6,t:3},{b:14,s:2}],ai:'cycle',big:1},
  lava:{hp:[165,165],mv:[{s:2,b:12},{a:6,t:3},{a:18},{w:1,v:2,a:5},{a:10,t:2}],ai:'cycle',big:1},
};
const GROUPS=[[['slime','slime'],['bee','bee','bee'],['bat','slime'],['wolf'],['bat','bee']],
  [['skel','spider'],['scarab','scarab'],['scorpion','bee'],['worm'],['skel','bat'],['spider','spider','bee']],
  [['mummy','spider'],['garg'],['treant','scarab'],['mummy','skel'],['worm','scorpion']]];
const RELICS={
  anchor:['船锚','每场战斗开始时获得 8 点格挡'],blood:['血瓶','每场战斗胜利后回复 5 点生命'],whet:['磨刀石','每场战斗开始时获得 1 点力量'],
  bag:['行囊','每场战斗第一回合多抽 2 张牌'],lantern:['提灯','每场战斗第一回合多 1 点能量'],sac:['毒囊','每场战斗开始时给全体敌人 3 层中毒'],
  shield:['塔盾','每回合结束时获得 3 点格挡'],purse:['钱袋','战斗获得的金币 +50%'],heart:['巨人之心','最大生命 +12'],spike:['刺甲','被攻击时反弹 2 点伤害'],key:['万能钥匙','商店价格打八折'],
};
const NODE={fight:['战斗','普通敌人'],elite:['精英','更强，掉遗物'],rest:['篝火','回血或升级'],shop:['商店','买牌、遗物、删牌'],event:['奇遇','未知事件'],chest:['宝箱','一件遗物'],boss:['魔王','最终一战']};

/* ---------- 规则 ---------- */
let R=null,FX=[];const SAVE='arcade-cards-run';
let stats={wins:0,best:0};try{stats=JSON.parse(localStorage.getItem('arcade-cards-stats')||'null')||stats}catch(e){}
const rnd=n=>Math.random()*n|0,pick=a=>a[rnd(a.length)],shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const has=k=>R.relics.includes(k);
function save(){try{if(!R||R.over)localStorage.removeItem(SAVE);else localStorage.setItem(SAVE,JSON.stringify(R))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(d&&d.v===1&&Array.isArray(d.deck)&&d.deck.every(c=>CARDS[c.id])){R=d;return true}}catch(e){}return false}
function newRun(){
  R={v:1,hp:75,max:75,gold:60,floor:0,relics:[],removes:0,deck:[...Array(5).fill('strike'),...Array(4).fill('defend'),'bash'].map(id=>({id,up:0})),screen:'map',next:['fight'],c:null,over:null};
  save();
}
function nextOptions(){
  const f=R.floor+1;if(f>=FLOORS)return['boss'];if(f===8)return['chest'];if(f===FLOORS-1)return['rest'];
  const w=[['fight',50],['event',16],['rest',f>=3?13:0],['shop',f>=3?11:0],['elite',f>=5?14:0]],out=[];
  const n=2+(Math.random()<.5);while(out.length<n){let x=Math.random()*w.reduce((a,b)=>a+b[1],0);for(const q of w){if((x-=q[1])<0){if(!out.includes(q[0])||q[0]==='fight')out.push(q[0]);break}}}
  if(!out.includes('fight')&&f<5)out[0]='fight';return out;
}

    en:ids.map(id=>{const d=EN[id],hp=Math.round((d.hp[0]+rnd(d.hp[1]-d.hp[0]+1))*hm);return{id,hp,max:hp,block:0,st:{vuln:0,weak:0,str:0,poison:0},mi:d.ai==='rand'?rnd(d.mv.length):0}})};

function drawCards(n){const C=R.c;for(let i=0;i<n;i++){if(!C.draw.length){if(!C.disc.length)return;C.draw=shuffle(C.disc);C.disc=[]}if(C.hand.length>=10)return;C.hand.push(C.draw.pop())}}
function startTurn(){const C=R.c;C.turn++;if(C.turn>1)C.block=0;C.energy=3+(C.turn===1&&has('lantern')?1:0);
  if(C.pw.plate)C.block+=C.pw.plate;if(C.pw.miasma)for(const e of C.en)if(e.hp>0)e.st.poison+=C.pw.miasma;

function hitEnemy(e,base){const C=R.c;if(e.hp<=0)return;let d=Math.floor((base+C.st.str)*(C.st.weak>0?.75:1)*(e.st.vuln>0?1.5:1));d=Math.max(0,d);

function play(i,ti){
  const C=R.c;if(!C||R.screen!=='fight'||R.over)return false;const card=C.hand[i];if(!card)return false;const d=cdef(card);if(d.c>C.energy)return false;
  let tg=null;if(needT(d)){const al=alive();tg=ti!=null&&C.en[ti]&&C.en[ti].hp>0?C.en[ti]:al.length===1?al[0]:null;if(!tg)return false}
  C.energy-=d.c;C.hand.splice(i,1);const ts=d.all?alive():tg?[tg]:[];
  if(d.selfdmg)loseHp(d.selfdmg);
  if(d.dmg)for(let k=0;k<(d.times||1);k++)for(const e of ts)hitEnemy(e,d.dmg);
  if(d.block){C.block+=d.block;FX.push({w:'p',t:'格挡 +'+d.block,c:'#8fc4ff'})}
  for(const e of ts){if(e.hp<=0)continue;if(d.vuln)e.st.vuln+=d.vuln;if(d.weak)e.st.weak+=d.weak;if(d.poison)e.st.poison+=d.poison}

  else if(d.hand!=null){const i=+d.hand,C=R.c;if(!canPlay(i)){toast('能量不够');return}const dd=cdef(C.hand[i]);
    if(sel===i){if(needT(dd)&&alive().length>1){toast('点一个敌人作为目标')}else{play(i,null);sel=null}}else sel=i}
  else if(d.foe!=null){if(sel!=null&&R.c.hand[sel]&&needT(cdef(R.c.hand[sel]))){if(play(sel,+d.foe))sel=null}else{const en=R.c.en[+d.foe],m=intent(en);toast(NAME[en.id]+'：下回合'+[m.a?`攻击 ${m.a}${m.t>1?'×'+m.t:''}`:'',m.b?`获得 ${m.b} 格挡`:'',m.s?`力量 +${m.s}`:'',m.w?`给你 ${m.w} 层虚弱`:'',m.v?`给你 ${m.v} 层易伤`:''].filter(Boolean).join('，'))}}
  else if(d.take!=null){takeReward(+d.take<0?null:+d.take)}
  else if(d.buyc!=null){if(!buyCard(+d.buyc))toast('金币不够')}
  else if(d.buyr!=null){if(!buyRelic(+d.buyr))toast('金币不够')}
  else if(d.ev!=null){const o=EVENTS[R.event].o[+d.ev][1];
    if(o==='up'){openPick('升级哪一张？','升级后数值更高',c=>!c.up,i=>{upgrade(i);toMap()});return}
    if(o==='rm'){openPick('删掉哪一张？','牌组越精简越稳定',()=>R.deck.length>5,i=>{removeCard(i);toMap()});return}
    const msg=o();if(msg==='金币不够'){toast(msg);return}if(msg)toast(msg);toMap()}
  else if(d.act==='end'){endTurn();return}
  else if(d.act==='heal')restHeal();
  else if(d.act==='smith'){if(!R.deck.some(c=>!c.up)){toast('没有可升级的牌');return}openPick('升级哪一张？','升级后数值更高',c=>!c.up,i=>{upgrade(i);toMap()});return}
  else if(d.act==='shoprm'){if(R.gold<R.shop.rm){toast('金币不够');return}openPick('删掉哪一张？','花费 '+R.shop.rm+' 金币',()=>R.deck.length>5,i=>{if(removeCard(i)){R.gold-=R.shop.rm;R.removes++;R.shop.rmDone=1}});return}
  else if(d.act==='leave')toMap();
  else if(d.act==='draw'){const C=R.c;ov={title:'抽牌堆',sub:'顺序已打乱',list:()=>C.draw.slice().sort((a,b)=>a.id<b.id?-1:1).map(c=>[c,0])}}
  else if(d.act==='disc'){const C=R.c;ov={title:'弃牌堆',list:()=>C.disc.map(c=>[c,0])}}
  else if(d.act==='new'){newRun();sel=null}
  render();
});
$('relics').addEventListener('click',e=>{const t=e.target.closest('[data-relic]');if(t)toast(RELICS[t.dataset.relic][0]+'：'+RELICS[t.dataset.relic][1])});
$('deckBtn').onclick=()=>{if(busy)return;ov=ov?null:{title:'牌组',sub:R.deck.length+' 张',list:()=>R.deck.map((c,i)=>[c,i])};render()};
$('menuBtn').onclick=()=>{if(busy||R.over)return;if(confirm('放弃这一局，重新开始？')){R.over='lose';R.c=null;save();sel=null;ov=null;render()}};
addEventListener('resize',layoutHand);
let last=0;(function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;drawMons(dt)})(0);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!busy)save()});
try{localStorage.setItem('arcade-last','cards')}catch(e){}
if(!load())newRun();
render();
window.__busy=()=>!!(R&&!R.over&&R.floor>0);
window.CG={get R(){return R},set R(v){R=v},newRun,enter,play,endTurnSync,takeReward,restHeal,upgrade,toMap,buyCard,buyRelic,alive,cdef,needT,intent,canPlay,CARDS,EN,EVENTS,RELICS,save,load,stats,ctext};
</script>
<script src="../update.js"></script>
</body>
</html>
